<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวิเคราะห์จัดซื้อและวางแผนผลิต - Version 1.63</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Sarabun', 'sans-serif'] },
                    colors: { primary: '#002060', highlight: '#ef4444', planning: '#059669' }
                }
            }
        }
    </script>
    
    <style>
        body { font-size: 10px; background-color: #ffffff; color: #000000; }
        h1, h2, h3, h4, th { color: #002060; font-weight: 700; }
        .text-highlight { color: #ef4444; font-weight: 700; }
        .table-container { max-height: calc(100vh - 410px); overflow-y: auto; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; white-space: nowrap; }
        th, td { border: 1px solid #e5e7eb; padding: 4px 8px; text-align: left; vertical-align: middle; }
        th { background-color: #f9fafb; position: sticky; top: 0; z-index: 20; user-select: none; }
        th:hover { background-color: #f3f4f6; }
        input, select { border: 1px solid #ccc; padding: 4px; border-radius: 4px; width: 100%; font-size: 10px; background-color: transparent; transition: all 0.2s; }
        input:focus, select:focus { outline: 1px solid #002060; background-color: #fff; box-shadow: 0 0 0 2px rgba(0,32,96,0.1); }
        .sticky-footer { position: sticky; bottom: 0; background-color: #f3f4f6; z-index: 30; font-weight: bold; border-top: 2px solid #002060; }
        .modal-overlay { background-color: rgba(0,0,0,0.5); z-index: 50; backdrop-filter: blur(2px); }
        .docx-preview-content { font-family: 'Sarabun', sans-serif; font-size: 14pt; line-height: 1.3; color: #000; }
        .docx-preview-content table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14pt; white-space: normal; }
        .docx-preview-content th, .docx-preview-content td { border: 1px solid #000; padding: 4px; text-align: left; }
        .docx-preview-content th { background-color: #f2f5f9; color: #002060; }
        optgroup { font-weight: 700; color: #002060; }
        option { color: #000; font-weight: normal; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        .resize-wrapper {
            resize: horizontal;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 40px;
            max-width: 600px;
            padding-right: 5px;
            cursor: col-resize;
        }
        .resize-wrapper > span { cursor: pointer; display: flex; align-items: center; flex: 1; }
        .sort-icon { font-size: 8px; color: #888; margin-left: 4px; display: inline-block; }
        .sort-icon.active { color: #ef4444; font-size: 10px; font-weight: bold; }
    </style>

    <!-- Dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Component } = React;

        // ==========================================
        // 1. CONSTANTS & PURE FUNCTIONS
        // ==========================================
        const VERSION = "Version 1.64 (GitHub Pages Ready & UI Optimized)";
        const CURRENT_DATE = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
        const PREDEFINED_GROUPS = ["แบบเรียน มัธยม", "แบบเรียน ปฐมวัย", "ห้องสมุด", "สินค้าซื้อมา-ขายไป", "พจนานุกรม"];

        const CHANGELOG = [
            { ver: "1.64", detail: "GitHub Pages Ready: ตั้งชื่อไฟล์เป็น index.html แก้ไขปัญหา Code 404, ผสานโลโก้ ทวพ (3.png), ปรับแต่งคอลัมน์ผลรวมท้ายตาราง (Footer Alignment) ให้ตรงคอลัมน์ 100%, ปรับปรุงการล้างแคช LocalStorage ให้ปลอดภัย" },
            { ver: "1.63", detail: "Strict Matching Engine: กำหนดกฎจับคู่ 3 ชั้น (ราคาต้องตรง, รหัสต้องตรง, ชื่อต้องตรง) เพื่อป้องกันสินค้าเวอร์ชันต่างราคาถูกหลอมรวมกัน" },
            { ver: "1.58", detail: "3-Way Verification UI: แสดง 'รหัสสินค้า' และ 'ราคาปก' ในตารางวิเคราะห์และตะกร้า เพื่อยืนยันความถูกต้อง" },
            { ver: "1.56", detail: "Core Stabilization: เปลี่ยนการประกาศฟังก์ชันทั้งหมดเป็น Standard Function (Hoisting) ขจัดปัญหาจอขาว" }
        ];

        const safeStorage = {
            get: function(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
            set: function(key, value) { try { localStorage.setItem(key, value); } catch (e) {} },
            remove: function(key) { try { localStorage.removeItem(key); } catch (e) {} }
        };

        function getFormattedDateStrings() {
            const d = new Date();
            const thYear = d.getFullYear() + 543;
            const dStr = `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${thYear}`;
            return { thYear, dStr };
        }

        function formatNum(num) {
            if (!num || isNaN(num)) return "0";
            return Number(num).toLocaleString('th-TH', { maximumFractionDigits: 2 });
        }

        function parseNum(str) {
            if (str === null || str === undefined || str === '') return 0;
            if (typeof str === 'number') return str;
            let cleaned = String(str).replace(/,/g, '').replace(/\s/g, '');
            let match = cleaned.match(/-?\d+(\.\d+)?/);
            return match ? Number(match[0]) : 0;
        }

        function calcCostPct(cost, price) {
            return price > 0 ? ((cost / price) * 100).toFixed(1) : "0.0";
        }

        function getRecQty(p, safetyStockPct) {
            const baseNeed = Math.max(0, parseNum(p.target) - parseNum(p.stock));
            return baseNeed + Math.ceil(baseNeed * (safetyStockPct / 100));
        }

        // --- NEW: Strict Match Logic (หัวใจสำคัญในการรวมยอดที่แม่นยำ) ---
        function isSameProduct(p1, p2) {
            const code1 = String(p1.productCode || "").trim().toUpperCase();
            const code2 = String(p2.productCode || "").trim().toUpperCase();
            const name1 = String(p1.name || "").trim().toLowerCase();
            const name2 = String(p2.name || "").trim().toLowerCase();
            const price1 = Number(p1.price) || 0;
            const price2 = Number(p2.price) || 0;

            // กฎข้อ 1: ถ้าราคามีทั้งคู่ และไม่เท่ากัน -> คนละสินค้า 100% (ห้ามรวมเด็ดขาด)
            if (price1 > 0 && price2 > 0 && price1 !== price2) {
                return false;
            }

            // กฎข้อ 2: ถ้ารหัสมีทั้งคู่ -> รหัสต้องตรงกันเท่านั้น
            if (code1 && code2) {
                return code1 === code2;
            }

            // กฎข้อ 3: ถ้ารหัสไม่มี หรือ มีรหัสข้างเดียว -> ใช้ชื่อสินค้าเป็นเกณฑ์หลัก
            if (name1 && name2) {
                return name1 === name2;
            }

            return false;
        }

        function calculateValues(row) {
            const price = parseNum(row.price);
            const cost = parseNum(row.cost);
            const discount = parseNum(row.discount);
            const produceQty = parseNum(row.produceQty);
            const target = parseNum(row.target);

            const netPrice = price - (price * (discount / 100));
            const totalCost = cost * produceQty;
            const vatAmount = totalCost * 0.07;
            const totalWithVat = totalCost + vatAmount;
            const costPct = calcCostPct(cost, price);
            
            const bepQty = netPrice > 0 ? Math.ceil(totalCost / netPrice) : 0;
            
            let advice = "พิจารณาอีกครั้ง";
            if (produceQty > 0 && bepQty > 0) {
                advice = produceQty >= bepQty ? "ควรผลิต" : "ไม่ควรผลิต";
            }

            return { 
                ...row, netPrice, bepQty, bepMoney: totalCost, vatAmount, 
                totalWithVat, costPct, advice, 
                totalSalesCover: target * price, totalSalesNet: target * netPrice
            };
        }

        function generatePlanDocxHtmlString(planData, safetyStockPct) {
            let productionItems = (planData || []).filter(p => getRecQty(p, safetyStockPct) > 0);
            
            // SORTING A-Z , ก-ฮ
            productionItems.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'th'));

            const prodGroups = {};
            let totalItems = 0;
            let totalTarget = 0;
            let totalStock = 0;
            let totalRecommended = 0;

            productionItems.forEach(item => {
                const g = item.group || 'ทั่วไป';
                if (!prodGroups[g]) prodGroups[g] = [];
                prodGroups[g].push(item);
                
                totalItems++;
                totalTarget += parseNum(item.target);
                totalStock += parseNum(item.stock);
                totalRecommended += getRecQty(item, safetyStockPct);
            });

            let groupsHtml = '';
            if (Object.keys(prodGroups).length === 0) {
                groupsHtml = '<p style="text-align: center; color: #666;">ไม่มีรายการที่ต้องผลิต</p>';
            } else {
                Object.entries(prodGroups).forEach(([gName, items]) => {
                    let groupTarget = 0;
                    let groupStock = 0;
                    let groupRec = 0;
                    items.forEach(i => {
                        groupTarget += parseNum(i.target);
                        groupStock += parseNum(i.stock);
                        groupRec += getRecQty(i, safetyStockPct);
                    });

                    groupsHtml += `<h4 style="margin-top: 15px; color: #059669;">📦 กลุ่มสินค้า: ${gName}</h4>`;
                    groupsHtml += `
                        <table style="font-size: 11pt;">
                            <thead>
                                <tr>
                                    <th>ลำดับ</th>
                                    <th>รหัส</th><th>ชื่อสินค้า</th><th>ราคา/หน่วย</th>
                                    <th>เป้าขาย</th><th>คงเหลือ</th>
                                    <th>ยอดผลิตพื้นฐาน</th><th>ยอดผลิตแนะนำ (+${safetyStockPct}%)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${items.map((r, index) => {
                                    const baseNeed = Math.max(0, parseNum(r.target) - parseNum(r.stock));
                                    const recQty = getRecQty(r, safetyStockPct);
                                    return `
                                    <tr>
                                        <td style="text-align: center;">${index + 1}</td>
                                        <td>${r.productCode || '-'}</td><td>${r.name}</td><td>${formatNum(r.price)}</td>
                                        <td>${formatNum(r.target)}</td><td>${formatNum(r.stock)}</td>
                                        <td>${formatNum(baseNeed)}</td><td><b>${formatNum(recQty)}</b></td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                        <div style="background-color: #f0fdf4; border-left: 4px solid #059669; padding: 8px; margin-bottom: 15px; font-size: 12pt; color: #065f46;">
                            <b>💡 บทสรุปและความเห็นประจำกลุ่ม:</b><br/>
                            กลุ่มสินค้านี้มีความต้องการตามเป้าหมายรวม <b>${formatNum(groupTarget)}</b> เล่ม แต่มีสต๊อกรองรับเพียง <b>${formatNum(groupStock)}</b> เล่ม 
                            จึงจำเป็นต้องสั่งผลิตเพิ่มรวม <b>${formatNum(groupRec)}</b> เล่ม <i>(ครอบคลุมการเผื่อความปลอดภัยทางสต๊อก หรือ Safety Stock ${safetyStockPct}% เรียบร้อยแล้ว)</i>
                        </div>
                    `;
                });
            }

            return `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"><title>รายงานสรุปแผนความต้องการผลิตสินค้า</title>
                <style>
                    body { font-family: 'TH Sarabun PSK', 'Sarabun', sans-serif; font-size: 14pt; color: #000; line-height: 1.3; }
                    p { margin: 4px 0; font-size: 14pt; }
                    h3 { color: #059669; margin-top: 15px; font-size: 16pt; font-weight: bold; border-bottom: 2px solid #059669; padding-bottom: 5px; }
                    h4 { color: #059669; margin-top: 10px; margin-bottom: 5px; font-size: 14pt; font-weight: bold; }
                    table { width: 100%; border-collapse: collapse; margin-top: 5px; margin-bottom: 5px; }
                    th, td { border: 1px solid #000; padding: 4px; text-align: left; vertical-align: top; }
                    th { background-color: #ecfdf5; color: #059669; font-weight: bold; }
                    b { font-weight: bold; }
                </style>
                </head>
                <body>
                    <p><b>บันทึกข้อความ</b></p>
                    <p><b>เรียน</b> ผู้บริหารฝ่ายผลิตและจัดซื้อ</p>
                    <p><b>เรื่อง</b> รายงานสรุปแผนความต้องการผลิตสินค้า (Production Requirement Plan)</p>
                    <p><b>วันที่ประเมิน</b> ${CURRENT_DATE}</p>
                    <br/>
                    <p>ตามที่ฝ่ายวางแผนได้ทำการกระทบยอดเป้าหมายการขายและยอดสต๊อกคงเหลือปัจจุบัน ระบบได้ทำการประมวลผลรายการสินค้าที่ <b>"มีความจำเป็นต้องสั่งผลิตเพิ่มเติม"</b> โดยคำนวณหักลบสต๊อกและรวมการเผื่อความปลอดภัย (Safety Stock ที่ ${safetyStockPct}%) เป็นยอดผลิตแนะนำ เพื่อนำไปใช้เป็นข้อมูลประกอบการจัดหา Supplier ในขั้นตอนต่อไป มีรายละเอียดเรียงตามตัวอักษรดังนี้</p>
                    <br/>
                    <h3>สรุปรายการความต้องการผลิต (แยกตามกลุ่มสินค้า)</h3>
                    ${groupsHtml}
                    
                    <table style="border: none; width: 100%; margin-top: 10px; margin-bottom: 5px;">
                        <tbody>
                            <tr style="font-weight: bold; color: #059669; background-color: #ecfdf5;">
                                <td style="border: 1px solid #059669; text-align: right; width: 50%; padding: 8px;">สรุปรวมจำนวนรายการที่ต้องผลิตทั้งสิ้น:</td>
                                <td style="border: 1px solid #059669; padding-left: 10px; width: 50%; padding: 8px;">${formatNum(totalItems)} รายการ</td>
                            </tr>
                            <tr style="font-weight: bold; color: #059669;">
                                <td style="border: 1px solid #059669; text-align: right; padding: 8px;">ยอดเป้าขายรวม (เฉพาะรายการผลิต):</td>
                                <td style="border: 1px solid #059669; padding-left: 10px; padding: 8px;">${formatNum(totalTarget)} เล่ม</td>
                            </tr>
                            <tr style="font-weight: bold; color: #ef4444;">
                                <td style="border: 1px solid #059669; text-align: right; padding: 8px;">ยอดสั่งผลิตแนะนำรวม (รวมเผื่อสต๊อก ${safetyStockPct}%):</td>
                                <td style="border: 1px solid #059669; padding-left: 10px; padding: 8px; font-size: 16pt;">${formatNum(totalRecommended)} เล่ม</td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <br/>
                    <p>จึงเรียนมาเพื่อโปรดพิจารณา และนำยอดแนะนำดังกล่าวไปดำเนินการสืบราคาและคัดเลือก Supplier ในลำดับต่อไป</p>
                    <br/><br/><br/>
                    
                    <table style="width: 100%; border: none; margin-top: 30px; text-align: center; font-size: 14pt;">
                        <tr>
                            <td style="border: none; width: 50%; padding: 0 10px; vertical-align: bottom;">
                                <p>................................................</p>
                                <p>จัดทำแผนโดย</p>
                                <p>ส่วนงานวางแผนและการตลาด</p>
                            </td>
                            <td style="border: none; width: 50%; padding: 0 10px; vertical-align: bottom;">
                                <p>................................................</p>
                                <p>รับทราบและรับมอบข้อมูลเพื่อจัดซื้อ</p>
                                <p>ส่วนงานจัดซื้อ</p>
                            </td>
                        </tr>
                    </table>
                </body>
                </html>
            `;
        }

        function generateDocxHtmlString(data, totalItems, totalQty, totalCost, totalVat, totalNet, assumedDiscount) {
            let productionItems = (data || []).filter(r => r.advice === 'ควรผลิต');
            
            // SORTING A-Z , ก-ฮ
            productionItems.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'th'));

            const prodGroups = {};
            productionItems.forEach(item => {
                const g = item.group || 'ทั่วไป';
                if (!prodGroups[g]) prodGroups[g] = [];
                prodGroups[g].push(item);
            });

            let groupsHtml = '';
            if (Object.keys(prodGroups).length === 0) {
                groupsHtml = '<p style="text-align: center; color: #666;">ไม่มีรายการที่แนะนำให้ผลิต</p>';
            } else {
                Object.entries(prodGroups).forEach(([gName, items]) => {
                    groupsHtml += `<h4 style="margin-top: 15px; color: #002060;">📁 กลุ่มสินค้า: ${gName}</h4>`;
                    groupsHtml += `
                        <table style="font-size: 11pt;">
                            <thead>
                                <tr>
                                    <th>ลำดับ</th>
                                    <th>รหัส</th><th>ชื่อหนังสือ</th><th>ผู้เขียน</th><th>ปก</th>
                                    <th>ผลิต</th><th>ทุน/เล่ม (%)</th><th>รวมทุน</th>
                                    <th>VAT 7%</th><th>รวมสุทธิ</th><th>Supplier</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${items.map((r, index) => `
                                    <tr>
                                        <td style="text-align: center;">${index + 1}</td>
                                        <td>${r.productCode || '-'}</td><td>${r.name}</td><td>${r.author || '-'}</td>
                                        <td>${formatNum(r.price)}</td><td>${formatNum(r.produceQty)}</td>
                                        <td>${formatNum(r.cost)} <span style="color: #ef4444;">(${r.costPct}%)</span></td>
                                        <td>${formatNum(r.bepMoney)}</td><td>${formatNum(r.vatAmount)}</td>
                                        <td><b>${formatNum(r.totalWithVat)}</b></td><td>${r.printer}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                });
            }

            return `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"><title>รายงานการวิเคราะห์และเสนอการผลิต</title>
                <style>
                    body { font-family: 'TH Sarabun PSK', 'Sarabun', sans-serif; font-size: 14pt; color: #000; line-height: 1.3; }
                    p { margin: 4px 0; font-size: 14pt; }
                    h3 { color: #002060; margin-top: 15px; font-size: 14pt; font-weight: bold; }
                    h4 { color: #002060; margin-top: 10px; margin-bottom: 5px; font-size: 14pt; font-weight: bold; }
                    table { width: 100%; border-collapse: collapse; margin-top: 5px; margin-bottom: 5px; }
                    th, td { border: 1px solid #000; padding: 4px; text-align: left; vertical-align: top; }
                    th { background-color: #f2f5f9; color: #002060; font-weight: bold; }
                    b { font-weight: bold; }
                </style>
                </head>
                <body>
                    <p><b>บันทึกข้อความ</b></p>
                    <p><b>เรียน</b> กรรมการผู้จัดการ</p>
                    <p><b>เรื่อง</b> ขอนำเสนอ และ อนุมัติ การผลิตสินค้าประจำปี</p>

            // ==========================================
            // EXCEL EXTRACTION LOGIC (SMART AGGREGATION)
            // ==========================================
            function processExcelToPlan(rawData, fileType) {
                let currentPlan = [...planData];
                let currentSettings = [...settings.products];
                
                const aggregated = {};
                
                rawData.forEach(rowObj => {
                    const rowKeys = Object.keys(rowObj);
                    
                    const getVal = (keys, excludeKeys = []) => {
                        for (let key of keys) {
                            const exactMatch = rowKeys.find(k => k.trim().toLowerCase() === key.toLowerCase());
                            if (exactMatch && rowObj[exactMatch] !== undefined && rowObj[exactMatch] !== "") return rowObj[exactMatch];
                        }
                        for (let key of keys) {
                            const includesMatch = rowKeys.find(k => {
                                const lowerK = k.trim().toLowerCase();
                                const isMatch = lowerK.includes(key.toLowerCase());
                                const isExcluded = excludeKeys.some(ex => lowerK.includes(ex.toLowerCase()));
                                return isMatch && !isExcluded;
                            });
                            if (includesMatch && rowObj[includesMatch] !== undefined && rowObj[includesMatch] !== "") return rowObj[includesMatch];
                        }
                        return null; 
                    };

                    const nameRaw = getVal(['ชื่อสินค้า', 'รายการสินค้า', 'ชื่อหนังสือ', 'สินค้า', 'item name', 'name']);
                    if (!nameRaw) return; 

                    const lowerName = String(nameRaw).toLowerCase().trim();
                    if (['รวม', 'ยอดรวม', 'total', 'grand total'].includes(lowerName)) return;

                    const codeRaw = getVal(['รหัสสินค้า', 'รหัส', 'code', 'item code']);
                    const safeCode = codeRaw ? String(codeRaw).trim().toUpperCase() : "";
                    const safeName = String(nameRaw).trim().toUpperCase();
                    
                    const itemPriceRaw = parseNum(getVal(['ราคาปก', 'ราคา/หน่วย', 'ราคา', 'price']));
                    const safePrice = itemPriceRaw > 0 ? itemPriceRaw : '0';
                    
                    // The internal key for aggregation within the SAME file
                    // Uses strict matching to prevent accidental merge inside the file
                    const key = `${safeCode}_${safeName}_${safePrice}`;

                    const excludeKeys = uploadMode === 'qty' 
                        ? ['บาท', 'เงิน', 'มูลค่า', 'amount', 'value', 'price', 'ยอดเงิน', 'baht']
                        : ['จำนวน', 'เล่ม', 'qty', 'quantity', 'ชิ้น', 'หน่วย'];

                    const targetRaw = getVal(['จำนวนเป้าหมาย', 'รวมเป้าขาย', 'เป้าขาย', 'เป้าหมาย', 'เป้า', 'target'], excludeKeys);
                    const stockRaw = getVal(['จำนวนคงเหลือ', 'คงเหลือทุกคลัง', 'คงเหลือ', 'สต๊อกสินค้า', 'ยอดยกมา', 'stock', 'balance', 'inventory'], excludeKeys);
                    const soldRaw = getVal(['จำนวนเล่มที่ขาย', 'จำนวนขาย', 'ยอดขายปีล่าสุด', 'ยอดขายปีที่แล้ว', 'ยอดขาย', 'sold', 'sales'], excludeKeys);
                    
                    const targetVal = targetRaw !== null ? parseNum(targetRaw) : null;
                    const stockVal = stockRaw !== null ? parseNum(stockRaw) : null;
                    const soldVal = soldRaw !== null ? parseNum(soldRaw) : null;

                    if (!aggregated[key]) {
                        aggregated[key] = {
                            name: String(nameRaw).trim(),
                            productCode: codeRaw ? String(codeRaw).trim() : "",
                            group: getVal(['กลุ่มสินค้า', 'หมวดหมู่']) || "",
                            type: getVal(['ประเภทสินค้า', 'ประเภท']) || "",
                            price: itemPriceRaw,
                            target: targetVal,
                            stock: stockVal,
                            sold: soldVal
                        };
                    } else {
                        if (targetVal !== null) aggregated[key].target = (aggregated[key].target || 0) + targetVal;
                        if (stockVal !== null) aggregated[key].stock = (aggregated[key].stock || 0) + stockVal;
                        if (soldVal !== null) aggregated[key].sold = (aggregated[key].sold || 0) + soldVal;
                    }
                });

                // Merge into current Plan & Settings using Smart Match
                Object.values(aggregated).forEach(item => {
                    const findIndexStrict = (arr) => {
                        return arr.findIndex(p => isSameProduct(item, p));
                    };

                    const dbIdx = findIndexStrict(currentSettings);
                    const existingDbItem = dbIdx >= 0 ? currentSettings[dbIdx] : null;
                    let finalPrice = item.price > 0 ? item.price : (existingDbItem ? existingDbItem.price : 0);

                    const convertToQty = (val) => {
                        if (val === null) return null;
                        if (uploadMode === 'amount') {
                            if (finalPrice > 0) return Math.round(val / finalPrice);
                            return 0; 
                        }
                        return val; 
                    };

                    const finalTarget = convertToQty(item.target);
                    const finalStock = convertToQty(item.stock);
                    const finalSold = convertToQty(item.sold);

                    const existingPlanIdx = findIndexStrict(currentPlan);
                    let planItem = existingPlanIdx >= 0 ? currentPlan[existingPlanIdx] : { id: Date.now() + Math.random(), name: item.name, productCode: item.productCode };

                    if (finalTarget !== null) planItem.target = finalTarget;
                    if (finalStock !== null) planItem.stock = finalStock;
                    if (finalSold !== null) planItem.lastYearSales = finalSold;
                    if (finalPrice > 0) planItem.price = finalPrice;
                    if (item.group) planItem.group = item.group;
                    if (item.type) planItem.type = item.type;
                    
                    // Auto-Heal: If uploaded item has a code but existing doesn't, update it
                    if (item.productCode && !planItem.productCode) planItem.productCode = item.productCode;
                    // Auto-Heal: If existing has a code but uploaded doesn't, inherit it
                    if (!item.productCode && planItem.productCode) item.productCode = planItem.productCode;

                    if (existingPlanIdx >= 0) currentPlan[existingPlanIdx] = planItem;
                    else currentPlan.push(planItem);

                    if (dbIdx >= 0) {
                        if (finalTarget !== null) currentSettings[dbIdx].target = finalTarget;
                        if (finalStock !== null) currentSettings[dbIdx].stock = finalStock;
                        if (finalSold !== null) currentSettings[dbIdx].sold = finalSold;
                        if (finalPrice > 0) currentSettings[dbIdx].price = finalPrice;
                        if (item.group) currentSettings[dbIdx].group = item.group;
                        if (item.productCode && !currentSettings[dbIdx].productCode) currentSettings[dbIdx].productCode = item.productCode;
                    } else {
                        currentSettings.push({
                            id: Date.now() + Math.random(),
                            group: item.group || "ทั่วไป",
                            productCode: item.productCode || "",
                            name: item.name,
                            author: "",
                            price: finalPrice || 0,
                            stock: finalStock || 0,
                            sold: finalSold || 0,
                            target: finalTarget || 0
                        });
                    }
                });

                setPlanData(currentPlan);
                setSettings(prev => ({...prev, products: currentSettings}));
            }

            function handleUploadPlanFile(e, fileType) {

                    const reader = new FileReader();
                    reader.onload = (evt) => {

            function handleCellChange(id, field, value) {
                setData(prevData => (prevData || []).map(row => {
                    if (row.id !== id) return row;
                    let updatedRow = { ...row, [field]: value };
                    
                    if (field === 'name' || field === 'productCode') {
                        const searchKey = field === 'name' ? value : updatedRow.name;
                        const searchCode = field === 'productCode' ? value : updatedRow.productCode;
                        
                        const foundProd = (settings.products || []).find(p => isSameProduct({ name: searchKey, productCode: searchCode, price: updatedRow.price }, p));
                        if (foundProd) {
                            if(!updatedRow.productCode) updatedRow.productCode = foundProd.productCode;
                            if(!updatedRow.price) updatedRow.price = foundProd.price;
                            if(!updatedRow.name && foundProd.name) updatedRow.name = foundProd.name;
                            if(!updatedRow.group && foundProd.group) updatedRow.group = foundProd.group;
                            updatedRow.author = foundProd.author || '';
                            updatedRow.stock = foundProd.stock || updatedRow.stock;
                            updatedRow.target = foundProd.target || updatedRow.target;
                        }
                    }

                    if (field === 'printer') {
                        const foundSupp = (settings.suppliers || []).find(s => 
                            s.supplierName === value && 
                            isSameProduct({ productCode: updatedRow.productCode, name: updatedRow.name, price: updatedRow.price }, { productCode: s.productCode, name: s.productName, price: s.coverPrice })
                        );
                        if (foundSupp) {
                            updatedRow.cost = parseNum(foundSupp.cost);

                    }

                    return calculateValues(updatedRow);

            // ==========================================

            const planTotals = useMemo(() => {
                let totalItems = (planData || []).length;
                let totalTarget = 0, totalStock = 0, totalBasicNeed = 0, totalRecommended = 0;
                (planData || []).forEach(p => {
                    totalTarget += parseNum(p.target);
                    totalStock += parseNum(p.stock);

                    totalBasicNeed += baseNeed;
                    totalRecommended += (baseNeed + Math.ceil(baseNeed * (safetyStockPct / 100)));
                });
                return { totalItems, totalTarget, totalStock, totalBasicNeed, totalRecommended };
            }, [planData, safetyStockPct]);

            const sortedPlanData = useMemo(() => {
                let items = [...(planData || [])];
                if (planSortConfig.key !== null) {
                    items.sort((a, b) => {
                        let aVal = a[planSortConfig.key], bVal = b[planSortConfig.key];
                        if (typeof aVal === 'string') aVal = aVal.toLowerCase();
                        if (typeof bVal === 'string') bVal = bVal.toLowerCase();
                        if (aVal < bVal) return planSortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return planSortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return items;
            }, [planData, planSortConfig]);

            const filteredPlanData = sortedPlanData.filter(p => {
                const matchGroup = !searchGroup || String(p.group || "").toLowerCase().includes(String(searchGroup).toLowerCase());
                const matchType = !searchType || String(p.type || "").toLowerCase().includes(String(searchType).toLowerCase());
                const matchName = !searchName || String(p.name || "").toLowerCase().includes(String(searchName).toLowerCase());
                const matchGlobal = !searchTerm || Object.values(p).some(val => val !== null && val !== undefined && String(val).toLowerCase().includes(String(searchTerm).toLowerCase()));
                return matchGroup && matchType && matchName && matchGlobal;
            });

            const sortedData = useMemo(() => {
                let sortableItems = [...(data || [])];
                if (sortConfig.key !== null) {
                    sortableItems.sort((a, b) => {
                        let aVal = a[sortConfig.key], bVal = b[sortConfig.key];
                        if (typeof aVal === 'string') aVal = aVal.toLowerCase();
                        if (typeof bVal === 'string') bVal = bVal.toLowerCase();
                        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;

                return sortableItems;

                const matchGroup = !searchGroup || String(item.group || "").toLowerCase().includes(String(searchGroup).toLowerCase());
                const matchName = !searchName || String(item.name || "").toLowerCase().includes(String(searchName).toLowerCase());
                const matchGlobal = !searchTerm || Object.values(item).some(val => val !== null && val !== undefined && String(val).toLowerCase().includes(String(searchTerm).toLowerCase()));
                return matchGroup && matchName && matchGlobal;
            });

            const groupedData = useMemo(() => {

            const totals = useMemo(() => {
                let supplierShares = {};

                let totalProduceValue = 0, totalProduceQty = 0, approvedInvestment = 0;
                let totalVatValue = 0, totalNetValue = 0;

                (data || []).forEach(curr => {
                    totalTargetValueCover += parseNum(curr.totalSalesCover);
                    totalTargetValueNet += parseNum(curr.totalSalesNet);
                    
                    totalProduceValue += parseNum(curr.bepMoney);
                    totalVatValue += parseNum(curr.vatAmount);
                    totalNetValue += parseNum(curr.totalWithVat);
                    
                    const qty = parseNum(curr.produceQty);

                    const suppName = curr.printer || 'ยังไม่ระบุ Supplier';
                    if (!supplierShares[suppName]) supplierShares[suppName] = { qty: 0, products: new Set() };

                return { totalTargetValueCover, totalTargetValueNet, totalProduceValue, totalProduceQty, approvedInvestment, totalVatValue, totalNetValue, supplierShares };
            }, [data]);

            const profitEvaluation = useMemo(() => {
                const requiredProfitRatio = 1 + (targetProfitMargin / 100);
                const targetSalesNet = totals.totalTargetValueNet; 
                const totalCost = totals.totalProduceValue;
                const requiredSalesForProfit = totalCost * requiredProfitRatio; 
                const projectedProfit = targetSalesNet - totalCost;
                const projectedMargin = targetSalesNet > 0 ? (projectedProfit / targetSalesNet) * 100 : 0;
                return { requiredSalesForProfit, projectedProfit, projectedMargin, isPassed: targetSalesNet >= requiredSalesForProfit };
            }, [totals, targetProfitMargin]);

                return (settings.products || []).filter(p =>

            // ==========================================
            // SETTINGS & DB HANDLERS
            // ==========================================
            function handleSaveProduct() {
                if (!newProd.name) return alert("กรุณาระบุชื่อสินค้า");
                const existingIdx = (settings.products || []).findIndex(p => isSameProduct(newProd, p));

                            ...updatedProducts[existingIdx],

                            price: parseNum(newProd.price),

                            sold: parseNum(newProd.sold) !== 0 ? parseNum(newProd.sold) : updatedProducts[existingIdx].sold,

                        price: parseNum(newProd.price),

                        id: Date.now() + Math.random() 
                    });

                alert("บันทึกรายการสินค้าเรียบร้อยแล้ว");
            }

            function getComparisonData() {
                let matchedSuppliers = settings.suppliers || [];
                if (compareSearch) {
                    const searchLower = String(compareSearch || "").toLowerCase();
                    const baseProd = (settings.products || []).find(p => 
                        String(p.name || "").toLowerCase().includes(searchLower) || 
                        (p.productCode && String(p.productCode || "").toLowerCase().includes(searchLower))
                    );
                    
                    matchedSuppliers = (settings.suppliers || []).filter(s =>
                        (baseProd && s.productCode && s.productCode === baseProd.productCode) ||
                        (baseProd && s.productName && s.productName === baseProd.name) ||
                        (s.productCode && String(s.productCode || "").toLowerCase().includes(searchLower)) ||
                        (s.productName && String(s.productName || "").toLowerCase().includes(searchLower)) ||
                        (s.supplierName && String(s.supplierName || "").toLowerCase().includes(searchLower))
                    );
                }

                let results = matchedSuppliers.map(s => {
                    const prod = (settings.products || []).find(p => isSameProduct({ productCode: s.productCode, name: s.productName }, p));
                    const coverPrice = prod ? parseNum(prod.price) : 0;
                    const discount = parseNum(compareDiscount);
                    const netPrice = coverPrice - (coverPrice * (discount / 100));
                    const cost = parseNum(s.cost);
                    const qty = parseNum(s.printQty);
                    const totalCost = cost * qty;
                    const bepQty = netPrice > 0 ? Math.ceil(totalCost / netPrice) : 0;
                    const costPct = calcCostPct(cost, coverPrice);
                    
                    return { 
                        ...s, coverPrice, cost, qty, totalCost, bepQty, bepMoney: totalCost, costPct, id: s.id, 
                        baseGroup: prod?.group || "ทั่วไป", productCode: s.productCode || prod?.productCode || "", productName: s.productName || prod?.name || "", author: prod?.author || ""
                    };
                });

                const groupedByProd = {};
                results.forEach(r => {
                    const key = `${r.productCode}_${r.productName}`;
                    if (!groupedByProd[key]) groupedByProd[key] = [];
                    groupedByProd[key].push(r);
                });

                let finalResults = [];
                Object.values(groupedByProd).forEach(group => {
                    const validResults = group.filter(r => r.bepQty > 0 && r.qty >= r.bepQty);
                    let bestSupplierId = null;
                    if (validResults.length > 0) {
                        validResults.sort((a, b) => a.totalCost - b.totalCost);
                        bestSupplierId = validResults[0].id;
                    }
                    group.forEach(r => {
                        let rec = "";
                        if (r.qty > 0 && r.bepQty > r.qty) rec = "หา supplier ใหม่"; 
                        else if (r.id === bestSupplierId) rec = "ควรเลือก"; 
                        else rec = "ไม่ควรเลือก"; 
                        finalResults.push({ ...r, recommendation: rec });
                    });
                });

                finalResults.sort((a, b) => String(a.productName || "").localeCompare(String(b.productName || ""), 'th'));
                return finalResults;
            }

                setSelectedCompareBasket(prev => {
                    const exists = prev.find(item => item.id === suppData.id);
                    if (exists) return prev.filter(item => item.id !== suppData.id);
                    return [...prev, { ...suppData, targetDiscount: compareDiscount }];
                });
            }

            function handleAddBasketToTable() {
                if (selectedCompareBasket.length === 0) return alert("กรุณาเลือกรายการเข้าตะกร้าก่อน");

                runWithLoading("กำลังเพิ่มรายการลงตาราง...", () => {
                    const newRows = selectedCompareBasket.map(item => {
                        const dbProd = (settings.products || []).find(p => isSameProduct({ productCode: item.productCode, name: item.productName }, p));
                        const planItem = (planData || []).find(pl => isSameProduct({ productCode: item.productCode, name: item.productName }, pl));
                        let produceQtyToUse = item.qty; 
                        
                        if (planItem && getRecQty(planItem, safetyStockPct) > 0) {

                        }

                            name: item.productName,
                            author: item.author,
                            price: item.coverPrice,
                            stock: dbProd ? (dbProd.stock || 0) : 0, 
                            sold: dbProd ? (dbProd.sold || 0) : 0, 
                            target: dbProd ? (dbProd.target || 0) : 0,
                            discount: item.targetDiscount,
                            cost: item.cost,
                            produceQty: produceQtyToUse,
                            printer: item.supplierName
                        });
                    });

                    setData(prev => [...(prev || []), ...newRows]);
                    setSelectedCompareBasket([]); 
                    setShowSettings(false); 
                });

            function handleFileUploadDB(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                runWithLoading("กำลังอ่านไฟล์ Excel เข้าสู่ระบบหลังบ้าน...", () => {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        try {
                            const bstr = evt.target.result;
                            const wb = XLSX.read(bstr, { type: 'binary' });
                            const ws = wb.Sheets[wb.SheetNames[0]];
                            const rawData = XLSX.utils.sheet_to_json(ws, { defval: "" });

                            let extractedProducts = [...(settings.products || [])];
                            const aggregated = {};

                            rawData.forEach(rowObj => {
                                const rowKeys = Object.keys(rowObj);
                                const getVal = (keys, excludeKeys = []) => {
                                    for (let key of keys) {
                                        const exactMatch = rowKeys.find(k => k.trim() === key);
                                        if (exactMatch && rowObj[exactMatch] !== undefined && rowObj[exactMatch] !== "") return rowObj[exactMatch];
                                    }
                                    for (let key of keys) {
                                        const includesMatch = rowKeys.find(k => {
                                            const lowerK = k.trim().toLowerCase();
                                            const isMatch = lowerK.includes(key.toLowerCase());
                                            const isExcluded = excludeKeys.some(ex => lowerK.includes(ex.toLowerCase()));
                                            return isMatch && !isExcluded;
                                        });
                                        if (includesMatch && rowObj[includesMatch] !== undefined && rowObj[includesMatch] !== "") return rowObj[includesMatch];
                                    }
                                    return null;
                                };

                                const nameRaw = getVal(['ชื่อหนังสือ', 'รายการสินค้า', 'ชื่อสินค้า', 'สินค้า', 'item name', 'name']);
                                if (!nameRaw) return;

                                const lowerName = String(nameRaw).toLowerCase().trim();
                                if (['รวม', 'ยอดรวม', 'total', 'grand total'].includes(lowerName)) return;

                                const codeRaw = getVal(['รหัสสินค้า', 'รหัส', 'code', 'item code']);
                                const safeCode = codeRaw ? String(codeRaw).trim().toUpperCase() : "";
                                const safeName = String(nameRaw).trim().toUpperCase();
                                
                                const itemPriceRaw = parseNum(getVal(['ราคาปก', 'ราคา/หน่วย', 'ราคา', 'price']));
                                const safePrice = itemPriceRaw > 0 ? itemPriceRaw : '0';
                                const key = `${safeCode}_${safeName}_${safePrice}`;

                                const authorRaw = getVal(['ผู้เขียน', 'ผู้แต่ง', 'นักเขียน', 'author']);
                                const groupRaw = getVal(['กลุ่มสินค้า', 'หมวดหมู่', 'หมวด', 'group']);
                                
                                const excludeKeys = uploadMode === 'qty' 
                                    ? ['บาท', 'เงิน', 'มูลค่า', 'amount', 'value', 'price', 'ยอดเงิน', 'baht']
                                    : ['จำนวน', 'เล่ม', 'qty', 'quantity', 'ชิ้น', 'หน่วย'];

                                const targetRaw = getVal(['จำนวนเป้าหมาย', 'รวมเป้าขาย', 'เป้าขาย', 'เป้าหมาย', 'เป้า', 'target'], excludeKeys);
                                const stockRaw = getVal(['จำนวนคงเหลือ', 'คงเหลือทุกคลัง', 'คงเหลือ', 'สต๊อกสินค้า', 'ยอดยกมา', 'stock', 'balance', 'inventory'], excludeKeys);
                                const soldRaw = getVal(['จำนวนเล่มที่ขาย', 'จำนวนขาย', 'ยอดขายปีล่าสุด', 'ยอดขายปีที่แล้ว', 'ยอดขาย', 'sold', 'sales'], excludeKeys);

                                const targetVal = targetRaw !== null ? parseNum(targetRaw) : null;
                                const stockVal = stockRaw !== null ? parseNum(stockRaw) : null;
                                const soldVal = soldRaw !== null ? parseNum(soldRaw) : null;

                                if (!aggregated[key]) {
                                    aggregated[key] = {
                                        name: String(nameRaw).trim(), productCode: codeRaw ? String(codeRaw).trim() : "",
                                        author: authorRaw, group: groupRaw, price: itemPriceRaw,
                                        stock: stockVal, sold: soldVal, target: targetVal
                                    };
                                } else {
                                    if (stockVal !== null) aggregated[key].stock = (aggregated[key].stock || 0) + stockVal;
                                    if (soldVal !== null) aggregated[key].sold = (aggregated[key].sold || 0) + soldVal;
                                    if (targetVal !== null) aggregated[key].target = (aggregated[key].target || 0) + targetVal;
                                }
                            });

                            Object.values(aggregated).forEach(item => {
                                const findIndexWithPrice = (arr) => {
                                    return arr.findIndex(p => isSameProduct(item, p));
                                };

                                const dbIdx = findIndexWithPrice(extractedProducts);
                                const existingDbItem = dbIdx >= 0 ? extractedProducts[dbIdx] : null;
                                let finalPrice = item.price > 0 ? item.price : (existingDbItem ? existingDbItem.price : 0);

                                const convertToQty = (val) => {
                                    if (val === null) return null;
                                    if (uploadMode === 'amount') {
                                        if (finalPrice > 0) return Math.round(val / finalPrice);
                                        return 0; 
                                    }
                                    return val; 
                                };

                                const finalTarget = convertToQty(item.target);
                                const finalStock = convertToQty(item.stock);
                                const finalSold = convertToQty(item.sold);

                                if (dbIdx < 0) {
                                    extractedProducts.push({ 
                                        id: Date.now() + Math.random(), 
                                        group: item.group || "ทั่วไป", productCode: item.productCode || "", name: item.name, author: item.author || "", 
                                        price: finalPrice || 0, stock: finalStock || 0, sold: finalSold || 0, target: finalTarget || 0 
                                    });
                                } else {
                                    if (finalPrice > 0) extractedProducts[dbIdx].price = finalPrice;
                                    if (item.author) extractedProducts[dbIdx].author = item.author;
                                    if (item.group) extractedProducts[dbIdx].group = item.group;
                                    if (finalStock !== null) extractedProducts[dbIdx].stock = finalStock;
                                    if (finalSold !== null) extractedProducts[dbIdx].sold = finalSold;
                                    if (finalTarget !== null) extractedProducts[dbIdx].target = finalTarget;
                                    if (item.productCode && !extractedProducts[dbIdx].productCode) extractedProducts[dbIdx].productCode = item.productCode;
                                }
                            });

                            setSettings(prev => ({ ...prev, products: extractedProducts }));
                            setFilesUploaded(prev => ({...prev, db: file.name}));
                            alert(`โหลดข้อมูลสำเร็จจากไฟล์: ${file.name} \n\n(จัดการรวมยอดซ้ำซ้อน และแปลงเป็นจำนวนเล่มตามการตั้งค่าเรียบร้อย)`);
                        } catch (err) {
                            alert("เกิดข้อผิดพลาดในการอ่านไฟล์");
                        }
                    };
                    reader.readAsBinaryString(file);
                });
                e.target.value = null;
            }

            function handleExportPlanExcel() {

                if (itemsToProduce.length === 0) return alert("ไม่มีรายการที่ยอดแนะนำเกิน 0 สำหรับส่งออก Excel");

                runWithLoading("กำลังเตรียมไฟล์ Excel แผนการผลิต...", () => {
                    itemsToProduce.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'th'));

                            "เผื่อสต๊อก (Safety)": safetyQty,

                                                <td className="p-1 text-right"><input type="number" value={p.target || 0} onChange={e => handlePlanCellChange(p.id, 'target', e.target.value)} className="w-20 text-right font-bold text-[#002060] bg-blue-50/50 p-1 border border-blue-200 rounded text-xs" /></td>

                                </table>

                                        <div className="bg-red-50 p-4 border border-red-100 rounded-xl shadow-sm flex flex-col justify-center">

                                        <div className="bg-yellow-50 p-4 border-2 border-yellow-400 rounded-xl shadow-sm flex flex-col justify-center">

                                        </div>
                                    </div>

                                        <div className="bg-white p-4 border border-gray-200 rounded-xl shadow-sm">

                                                                <div className="flex justify-between items-center mb-1">
                                                                    <span className="font-bold text-[#002060] text-[12px]">{supp}</span>
                                                                    <div className="text-right">
                                                                        <span className="font-bold text-[#002060]">{formatNum(info.qty)} เล่ม</span>
                                                                        <span className="text-highlight font-bold text-[10px] bg-red-50 px-1 rounded ml-1">({pct}%)</span>

                                            </div>
                                        </div>
                                    </div>

                                            <button onClick={() => setTableFilter('produce')} className={`px-4 py-1.5 rounded-full font-bold transition ${tableFilter === 'produce' ? 'bg-green-600 text-white shadow' : 'text-gray-600 hover:bg-gray-300'}`}>เฉพาะที่มีรายการผลิต</button>

                                        <button onClick={handleQuickAdd} className="bg-[#002060] text-white px-4 py-1.5 font-bold rounded shadow hover:bg-blue-800 transition">เพิ่ม</button>

                                            <button onClick={() => applyBatchProduceQty('target')} className="bg-green-600 text-white px-2 py-1 rounded font-bold hover:bg-green-700 shadow-sm transition" title="ตั้งยอดผลิตเท่ากับเป้าขายหักสต๊อก">ตามเป้า-สต๊อก</button>

                                <div className="table-container custom-scrollbar">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th className="w-8 text-center"><input type="checkbox" checked={filteredData.length > 0 && filteredData.every(r => selectedRowIds.includes(r.id))} onChange={() => handleSelectAll(filteredData)} className="w-4 h-4 cursor-pointer accent-blue-600" title="เลือกทั้งหมด" /></th>
                                                <th onClick={() => handleSort('group')} className="resizable-th"><div className="resize-wrapper min-w-[80px]"><span>กลุ่มสินค้า</span> {getSortIcon('group', false)}</div></th>
                                                <th onClick={() => handleSort('productCode')} className="resizable-th"><div className="resize-wrapper min-w-[60px]"><span>รหัสสินค้า</span> {getSortIcon('productCode', false)}</div></th>
                                                <th onClick={() => handleSort('name')} className="resizable-th"><div className="resize-wrapper min-w-[200px]"><span>ชื่อหนังสือ</span> {getSortIcon('name', false)}</div></th>

                                                            <tr key={row.id} className={`hover:bg-blue-50 transition ${selectedRowIds.includes(row.id) ? 'bg-yellow-50/60' : ''}`}>

                                                                    <input 
                                                                        title={row.name} 
                                                                        value={row.name} 
                                                                        list="products-list"

                                                                <td><input type="number" value={row.target} onChange={(e) => handleCellChange(row.id, 'target', e.target.value)} className="text-right font-bold text-[#002060] bg-yellow-50 border-yellow-200 w-full" /></td>

                                                                <td className="bg-gray-100 text-right font-bold text-[#002060] border-l-2 border-gray-300 w-full">{formatNum(row.totalWithVat)}</td>
                                                                <td>
                                                                    <select value={row.printer} onChange={(e) => handleCellChange(row.id, 'printer', e.target.value)} className="w-full bg-white shadow-sm truncate border">
                                                                        <option value="">- เลือกผู้ผลิต -</option>
                                                                        {matchingSuppliers.length > 0 && (
                                                                            <optgroup label="✅ ผู้ผลิตที่ประเมินราคาไว้">
                                                                                {matchingSuppliers.map((s, idx) => <option key={idx} value={s.supplierName}>{s.supplierName} (ทุน: {formatNum(s.cost)}, ผลิต: {formatNum(s.printQty)})</option>)}
                                                                            </optgroup>
                                                                        )}
                                                                        <optgroup label="🖨️ โรงพิมพ์ทั่วไป (ไม่ดึงยอด)">
                                                                            {(settings.printers || []).map((pr, idx) => <option key={idx} value={pr}>{pr}</option>)}
                                                                        </optgroup>
                                                                    </select>
                                                                </td>
                                                                <td className="bg-gray-50 font-bold text-right text-[#002060] w-full">{formatNum(row.totalSalesCover)}</td>
                                                                <td className="text-center"><button onClick={() => setData((data || []).filter(r => r.id !== row.id))} className="text-highlight font-bold bg-red-50 px-3 py-1 rounded hover:bg-red-500 hover:text-white transition">X</button></td>
                                                            </tr>
                                                        )})}
                                                    </React.Fragment>
                                                );
                                            })}
                                        </tbody>
                                        <tfoot>
                                            <tr className="sticky-footer shadow-lg">

                                                <td className="text-[#002060] text-[12px] text-right font-black">{formatNum(totals.totalProduceQty)} เล่ม</td>
                                                <td></td>

                                                <td className="text-gray-600 text-[12px] text-right font-bold">{formatNum(totals.totalVatValue)} ฿</td>
                                                <td className="text-[#002060] text-[12px] text-right font-black">{formatNum(totals.totalNetValue)} ฿</td>
                                                <td></td>
                                                <td className="text-[#002060] text-[12px] text-right font-black">{formatNum(totals.totalTargetValueCover)} ฿</td>
                                                <td></td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================================= */}
                    {/* MODALS SECTION */}
                    {/* ========================================================= */}
                    
                    {/* FULL SETTINGS MODAL RESTORED */}
                    {showSettings && (
                        <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50">
                            <div className="bg-white w-[1000px] max-h-[90vh] flex flex-col shadow-2xl rounded-2xl border-t-4 border-[#002060] overflow-hidden">
                                <div className="bg-gray-50 text-[#002060] p-4 flex justify-between items-center border-b">
                                    <h3 className="m-0 font-bold text-lg">⚙️ ฐานข้อมูลระบบและตั้งค่าวิเคราะห์</h3>
                                    <button onClick={() => setShowSettings(false)} className="text-gray-400 font-bold hover:text-red-500 text-xl">✖</button>
                                </div>
                                <div className="flex bg-gray-100 border-b">
                                    <button onClick={() => setSettingMenu(1)} className={`flex-1 py-3.5 font-bold text-center border-r transition text-[13px] ${settingMenu === 1 ? 'bg-white text-[#002060] border-b-2 border-b-[#002060] shadow-sm' : 'text-gray-500 hover:bg-gray-200'}`}>1. 🏷️ ฐานข้อมูลสินค้า</button>
                                    <button onClick={() => setSettingMenu(2)} className={`flex-1 py-3.5 font-bold text-center border-r transition text-[13px] ${settingMenu === 2 ? 'bg-white text-[#002060] border-b-2 border-b-[#002060] shadow-sm' : 'text-gray-500 hover:bg-gray-200'}`}>2. 📦 วิเคราะห์ Supplier</button>
                                    <button onClick={() => setSettingMenu(3)} className={`flex-1 py-3.5 font-bold text-center border-r transition text-[13px] ${settingMenu === 3 ? 'bg-white text-[#002060] border-b-2 border-b-[#002060] shadow-sm' : 'text-gray-500 hover:bg-gray-200'}`}>3. 📊 ตะกร้าส่งลงตาราง</button>
                                    <button onClick={() => setSettingMenu(4)} className={`flex-1 py-3.5 font-bold text-center transition text-[13px] ${settingMenu === 4 ? 'bg-white text-[#002060] border-b-2 border-b-[#002060] shadow-sm' : 'text-gray-500 hover:bg-gray-200'}`}>4. 📝 ตั้งค่าระบบ / ประวัติ</button>
                                </div>
                                <div className="p-6 flex-1 overflow-y-auto flex flex-col gap-5 bg-white custom-scrollbar">
                                    {/* Menu 1 */}
                                    {settingMenu === 1 && (
                                        <div className="flex flex-col gap-4 h-full">
                                            <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 shadow-sm flex flex-col gap-3">
                                                <h4 className="text-[#002060] font-bold">เมนู 1: ฐานข้อมูลสินค้ามาตรฐาน</h4>
                                                <div className="flex items-center gap-2 bg-white p-2 border rounded">
                                                    <span className="font-bold text-[11px] text-[#002060]">อัปโหลดไฟล์ Excel เข้าฐาน:</span>
                                                    <label className="flex items-center gap-1 text-[11px] cursor-pointer"><input type="radio" checked={uploadMode === 'amount'} onChange={() => setUploadMode('amount')} /> <span className="text-orange-600 font-bold">ยอดเงิน (บาท)</span></label>

                                                    <label className="bg-[#002060] text-white px-4 py-1.5 text-xs font-bold rounded cursor-pointer ml-auto">📤 โหลดเข้าฐาน <input type="file" className="hidden" onChange={handleFileUploadDB} /></label>
                                                </div>
                                            </div>
                                            <div className="flex-1 flex flex-col bg-white border rounded-xl p-4 shadow-sm min-h-[250px]">
                                                <div className="flex gap-2 mb-4">
                                                    <input type="text" placeholder="รหัส" value={newProd.productCode} onChange={e => setNewProd({...newProd, productCode: e.target.value})} className="w-1/6 border rounded p-2" />

                                        <div>
                                            <div className="font-bold text-red-800 text-xs">3. ⚠️ ล้างข้อมูลทั้งหมดทั้งระบบ (Master Reset)</div>
                                            <div className="text-[11px] text-red-600">ล้างทั้ง Tab 1, Tab 2 และไฟล์อ้างอิง เพื่อเริ่มต้นใหม่ทันที</div>
                                        </div>
                                        <button onClick={handleMasterReset} className="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-700 shadow">ล้างทั้งหมด</button>
                                    </div>
                                </div>
                                <div className="mt-5 text-right border-t pt-3">
                                    <button onClick={() => setShowClearModal(false)} className="bg-gray-200 text-gray-700 px-5 py-1.5 rounded-lg text-xs font-bold hover:bg-gray-300">ยกเลิก</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {isLoading && <div className="fixed inset-0 modal-overlay flex items-center justify-center z-[100]"><div className="bg-white p-8 rounded-2xl shadow-2xl border-t-4 border-[#002060] text-center"><div className="w-12 h-12 border-4 border-blue-200 border-t-[#002060] rounded-full animate-spin mb-4 mx-auto"></div><h3 className="text-[#002060] text-lg font-bold">{loadingText}</h3></div></div>}
                </div>
            );
        }

        // ==========================================
        // 3. RENDER (Wrapped in Error Boundary)
        // ==========================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
