    <div id="root"></div>

    <script type="text/babel" data-presets="env,react">
        const { useState, useEffect, useMemo, Component } = React;
        const VERSION = "V2.26 (V2.18 Core + Google Sheets Cloud Sync)";
        const CURRENT_DATE = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbzsn-az6Z9BbYaYRi40K-UhYK6znciva8chJX-3lJ4KjzMvEqpSrOtwRxSi__bkoCOucQ/exec";
        const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/1FE5BRObnJ-HPHkyEszs4fZxeSOsXEb7YvlUKW9mLg9Y/edit?gid=810971632#gid=810971632";

        const extractSheetId = function(urlOrId) {
            if (!urlOrId) return "";
            const m = String(urlOrId).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
            return m ? m[1] : String(urlOrId).trim();
        };

        const fetchSheetViaGviz = function(sheetUrlOrId, sheetName) {
            return new Promise(function(resolve, reject) {
                const sId = extractSheetId(sheetUrlOrId);
                if (!sId) return reject(new Error("ไม่พบรหัส Google Sheets ID"));
                const cbName = "__gviz_cb_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
                const script = document.createElement("script");
                const timer = setTimeout(function() {
                    if (window[cbName]) delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    reject(new Error("หมดเวลาเชื่อมต่อชีต " + sheetName));
                }, 10000);

                window[cbName] = function(res) {
                    clearTimeout(timer);
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    if (!res || res.status === "error" || !res.table) {
                        return reject(new Error("ไม่สามารถอ่านชีต " + sheetName));
                    }
                    const cols = (res.table.cols || []).map(function(c, idx) {
                        return (c && (c.label || c.id)) ? String(c.label || c.id).trim() : ("col_" + idx);
                    });
                    const rows = (res.table.rows || []).map(function(r) {
                        const obj = { _rawCells: [] };
                        (r.c || []).forEach(function(cell, idx) {
                            const val = cell ? (cell.v !== undefined && cell.v !== null ? cell.v : (cell.f || "")) : "";
                            obj[cols[idx] || ("col_" + idx)] = val;
                            obj._rawCells.push(val);
                        });
                        return obj;
                    });
                    resolve({ cols: cols, rows: rows });
                };

                script.onerror = function() {
                    clearTimeout(timer);
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    reject(new Error("ต้องเปิดสิทธิ์แชร์ Google Sheets เป็น 'ทุกคนที่มีลิงก์อ่านได้' หรือดึงผ่าน Apps Script"));
                };

                script.src = "https://docs.google.com/spreadsheets/d/" + sId + "/gviz/tq?tqx=out:json;responseHandler:" + cbName + "&sheet=" + encodeURIComponent(sheetName) + "&_=" + Date.now();
                document.body.appendChild(script);
            });
        };

        // --- สร้างโลโก้ ทวพ แบบ PNG Base64 ฝังในตัวโปรแกรม ---
        const createDefaultLogoBase64 = function() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 220;
                canvas.height = 200;
                const ctx = canvas.getContext('2d');

                const drawCircle = function(cx, cy, r, charText) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = '#3730a3';
                    ctx.lineWidth = 6;
                    ctx.stroke();
                    ctx.fillStyle = '#3730a3';
                    ctx.font = 'bold 44px Sarabun, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(charText, cx, cy + 2);
                };

                drawCircle(110, 62, 46, 'ท');
                drawCircle(72, 130, 46, 'ว');
                drawCircle(148, 130, 46, 'พ');

                return canvas.toDataURL('image/png');
            } catch (e) {
                return "";
            }
        };

        const DEFAULT_LOGO_DATA_URI = createDefaultLogoBase64();

        // --- SAFE STORAGE ---
        const safeStorage = {
            get: function(k) { 
                try { 
                    const v = localStorage.getItem(k); 
                    return v ? JSON.parse(v) : null; 
                } catch(e) { 
                    return null; 
                } 
            },
            set: function(k, v) { 
                try { 
                    localStorage.setItem(k, JSON.stringify(v)); 
                } catch(e) {
                    if (k === 'p_hist' && Array.isArray(v) && v.length > 1) {
                        try { localStorage.setItem(k, JSON.stringify(v.slice(-3))); } catch(err) {}
                    }
                } 
            },
            remove: function(k) { try { localStorage.removeItem(k); } catch(e) {} },
            clearAll: function() { try { localStorage.clear(); } catch(e) {} }
        };

        const generateDocNo = function(seq) {
            const s = seq || 1;
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const runNo = String(s).padStart(3, '0');
            return "Pur:69" + month + "-" + runNo;
        };

        const formatNum = function(n) {
            if (n === null || n === undefined || n === '') return "0";
            const cleaned = String(n).replace(/,/g, '');
            if (isNaN(Number(cleaned))) return "0";
            return Number(cleaned).toLocaleString('en-US', { maximumFractionDigits: 2 });
        };
        
        const parseNum = function(s) { 
            if (s === null || s === undefined || s === '') return 0; 
            if (typeof s === 'number') return isNaN(s) ? 0 : s; 
            const m = String(s).replace(/,/g, '').match(/-?\d+(\.\d+)?/); 
            return m ? Number(m[0]) : 0; 
        };
        
        const formatInput = function(v) { 
            if (v === null || v === undefined || v === '') return ""; 
            let s = String(v).replace(/,/g, '').replace(/[^\d.-]/g, '');
            if (s === '-' || s === '.' || s === '-.') return s;
            let parts = s.split('.');
            let intP = parseInt(parts[0], 10);
            let res = isNaN(intP) ? '' : intP.toLocaleString('en-US');
            if (parts.length > 1) res += '.' + parts[1].slice(0, 2);
            return res;
        };
        
        const calcCostPct = function(cost, price) {
            const c = parseNum(cost), p = parseNum(price);
            return p > 0 ? ((c / p) * 100).toFixed(2) : "0.00";
        };

        const getRecQty = function(p, sf) { 
            if (!p) return 0;
            const b = Math.max(0, parseNum(p.target) - parseNum(p.stock)); 
            return b + Math.ceil(b * (parseNum(sf) / 100)); 
        };

        function isSameProduct(p1, p2) {
            if (!p1 || !p2) return false;
            const c1 = String(p1.productCode || "").trim().toUpperCase();
            const c2 = String(p2.productCode || "").trim().toUpperCase();
            const n1 = String(p1.name || p1.productName || "").trim().toLowerCase().replace(/\s+/g, ' ');
            const n2 = String(p2.name || p2.productName || "").trim().toLowerCase().replace(/\s+/g, ' ');
            const pr1 = parseNum(p1.price || p1.coverPrice);
            const pr2 = parseNum(p2.price || p2.coverPrice);
            
            if (pr1 > 0 && pr2 > 0 && pr1 !== pr2) return false;
            const iv1 = c1 && c1 !== '-' && c1 !== 'N/A' && c1 !== 'ไม่มี';
            const iv2 = c2 && c2 !== '-' && c2 !== 'N/A' && c2 !== 'ไม่มี';
            
            if (iv1 && iv2 && c1 === c2) return true;
            if (n1 && n2 && n1 === n2) return true;
            return false;
        }

        function calculateValues(row, defaultDisc) {
            const defD = defaultDisc !== undefined ? defaultDisc : 30;
            if (!row) return {};
            const pr = parseNum(row.price);
            const cst = parseNum(row.cost);
            const disc = (row.discount !== undefined && row.discount !== "") ? parseNum(row.discount) : parseNum(defD);
            const qty = parseNum(row.produceQty);
            const tgt = parseNum(row.target);
            
            const net = pr * (1 - (disc / 100));
            const tc = cst * qty;
            const vat = tc * 0.07;
            const tn = tc + vat;
            const bep = (net > 0 && tc > 0) ? Math.ceil(tc / net) : 0;
            const expectedRev = qty * net;
            const expectedProfit = expectedRev - tc;

            return Object.assign({}, row, { 
                discount: disc,
                netPrice: net, 
                bepQty: bep, 
                bepMoney: tc, 
                vatAmount: vat, 
                totalWithVat: tn, 
                costPct: Number(calcCostPct(cst, pr)), 
                expectedRev: expectedRev,
                expectedProfit: expectedProfit,
                suppRef: row.suppRef !== undefined ? String(row.suppRef) : "",
                creditTerm: row.creditTerm !== undefined ? String(row.creditTerm) : "",
                advice: (qty > 0 && bep > 0 ? (qty >= bep ? "ผ่านเกณฑ์คุ้มทุน" : "ต่ำกว่าจุดคุ้มทุน") : "รอระบุต้นทุน"), 
                totalSalesCover: tgt * pr, 
                totalSalesNet: tgt * net 
            });
        }

        // --- A4 INTERNAL MEMO HTML GENERATOR (Sarabun 14pt ทุกจุด + โลโก้ Base64) ---
        function getDocxHTML(dataArr, mode, safePct, aiRef, docNo, avgDisc, logoSrc) {
            const isPlan = mode === 'plan';
            const isBep = mode === 'bep';
            const isAiExec = mode === 'ai_exec';
            const activeLogo = logoSrc || DEFAULT_LOGO_DATA_URI;
            
            const fontCss = "font-family:'Sarabun','TH Sarabun New','TH Sarabun PSK',sans-serif;mso-ascii-font-family:'Sarabun';mso-hansi-font-family:'Sarabun';mso-bidi-font-family:'Sarabun';font-size:14.0pt;mso-ansi-font-size:14.0pt;mso-bidi-font-size:14.0pt;";
            const cellStyleBase = "border:1px solid #000;padding:4px 5px;vertical-align:top;" + fontCss;
            const thStyleBase = "border:1px solid #000;padding:5px 4px;background-color:#f1f5f9;color:#000;font-weight:bold;text-align:center;vertical-align:middle;" + fontCss;

            let validItems = (dataArr || []).filter(function(r) {
                return r && (isPlan ? getRecQty(r, safePct) > 0 : parseNum(r.produceQty) > 0);
            });
            validItems.sort(function(a, b) {
                return String(a.name || '').localeCompare(String(b.name || ''), 'th');
            });
            
            let sumT = 0, sumS = 0, sumR = 0, sumTotalCost = 0, sumBepQty = 0, sumNetRev = 0, sumProfit = 0;

            let rowsHtml = validItems.map(function(r, i) {
                const rec = isPlan ? getRecQty(r, safePct) : parseNum(r.produceQty);
                const pr = parseNum(r.price), cost = parseNum(r.cost), totAmt = rec * cost;
                const disc = (r.discount !== undefined && r.discount !== "") ? parseNum(r.discount) : parseNum(avgDisc);
                const netPrice = pr * (1 - (disc / 100));
                const bepQty = (netPrice > 0 && totAmt > 0) ? Math.ceil(totAmt / netPrice) : 0;
                const netRev = rec * netPrice;
                const profit = netRev - totAmt;

                sumT += parseNum(r.target); 
                sumS += parseNum(r.stock); 
                sumR += rec; 
                sumTotalCost += totAmt;
                sumBepQty += bepQty;
                sumNetRev += netRev;
                sumProfit += profit;

                if (isPlan) {
                    return '<tr>' +
                        '<td style="' + cellStyleBase + 'text-align:center;">' + (i + 1) + '</td>' +
                        '<td class="code-cell" style="' + cellStyleBase + 'text-align:left;word-break:break-word;">' + (r.productCode || '-') + '</td>' +
                        '<td class="wrap-cell" style="' + cellStyleBase + 'text-align:left;word-break:break-word;">' + (r.name || '-') + '</td>' +
                        '<td class="num" style="' + cellStyleBase + 'text-align:right;white-space:nowrap;">' + formatNum(pr) + '</td>' +
                        '<td class="num" style="' + cellStyleBase + 'text-align:right;white-space:nowrap;">' + formatNum(r.target) + '</td>' +
                        '<td class="num" style="' + cellStyleBase + 'text-align:right;white-space:nowrap;">' + formatNum(r.stock) + '</td>' +
                        '<td class="num" style="' + cellStyleBase + 'text-align:right;font-weight:bold;white-space:nowrap;">' + formatNum(rec) + '</td>' +
                    '</tr>';
                } else if (isBep || isAiExec) {
                    const bepPct = rec > 0 ? ((bepQty / rec) * 100).toFixed(1) : "0.0";
                    return '<tr>' +
                        '<td style="' + cellStyleBase + 'text-align:center;">' + (i + 1) + '</td>' +
                        '<td class="code-cell" style="' + cellStyleBase + 'text-align:left;word-break:break-word;">' + (r.productCode || '-') + '</td>' +
                        '<td class="wrap-cell" style="' + cellStyleBase + 'text-align:left;word-break:break-word;">' + (r.name || '-') + '</td>' +
                        '<td class="num" style="' + cellStyleBase + 'text-align:right;white-space:nowrap;">' + formatNum(pr) + '</td>' +
                        '<td class="num" style="' + cellStyleBase + 'text-align:right;white-space:nowrap;">' + formatNum(netPrice) + '</td>' +
                        '<td class="num" style="' + cellStyleBase + 'text-align:right;font-weight:bold;white-space:nowrap;">' + formatNum(rec) + '</td>' +
                        '<td class="num" style="' + cellStyleBase + 'text-align:right;white-space:nowrap;">' + formatNum(cost) + '</td>' +
                        '<td class="num" style="' + cellStyleBase + 'text-align:right;font-weight:bold;white-space:nowrap;">' + formatNum(totAmt) + '</td>' +
                        '<td class="num" style="' + cellStyleBase + 'text-align:right;font-weight:bold;color:#002060;white-space:nowrap;">' + formatNum(bepQty) + '</td>' +
                        '<td style="' + cellStyleBase + 'text-align:center;white-space:nowrap;">' + bepPct + '%</td>' +
                    '</tr>';
                } else {
                    const cPct = pr > 0 ? ((cost / pr) * 100).toFixed(1) : "0.0";
                    const suppInfo = [r.printer, r.creditTerm ? '(เครดิต: ' + r.creditTerm + ')' : '', r.suppRef ? '[Ref: ' + r.suppRef + ']' : ''].filter(Boolean).join(' ');
                    return '<tr>' +

            const applySnapshotObject = function(parsed, timestampLabel) {
                if (Array.isArray(parsed.planData)) setPlanData(parsed.planData.filter(Boolean));
                if (Array.isArray(parsed.data)) {
                    setData(parsed.data.filter(Boolean).map(function(d) { return calculateValues(d, avgDisc); }));
                }
                if (parsed.settings && typeof parsed.settings === 'object') {
                    setSettings({
                        printers: Array.isArray(parsed.settings.printers) ? parsed.settings.printers : settings.printers,
                        products: Array.isArray(parsed.settings.products) ? parsed.settings.products : settings.products,
                        suppliers: Array.isArray(parsed.settings.suppliers) ? parsed.settings.suppliers : settings.suppliers
                    });
                }
                sendAuditLog("ดึงข้อมูล JSON Snapshot จากคลาวด์", "SUCCESS", "Restored backup from " + (timestampLabel || "Cloud"));
                alert("✅ ดึงข้อมูล Snapshot ล่าสุดจาก Google Sheets สำเร็จ!\n\n• วัน-เวลาที่สำรองไว้: " + (timestampLabel || "ล่าสุด") + "\n• แผนผลิต (Tab 1): " + (parsed.planData ? parsed.planData.length : 0) + " รายการ\n• วิเคราะห์จัดซื้อ (Tab 2): " + (parsed.data ? parsed.data.length : 0) + " รายการ\n• สินค้าในฐาน: " + (parsed.settings && parsed.settings.products ? parsed.settings.products.length : 0) + " รายการ");
            };

            // --- ดึงข้อมูลในอดีตจาก Google Sheets ---
            const pullFromGoogleSheets = function(pullMode) {
                setLoadText("กำลังดึงข้อมูลจาก Google Sheets Cloud...");
                setIsLoading(true);

                if (pullMode === 'snapshot') {
                    fetch(gasUrl + "?action=get_latest_backup&_=" + Date.now(), { method: 'GET', redirect: 'follow' })
                        .then(function(r) { return r.json(); })
                        .then(function(resJson) {
                            if (resJson && resJson.snapshot && String(resJson.snapshot).trim().indexOf('{') === 0) {
                                const parsed = JSON.parse(resJson.snapshot);
                                setIsLoading(false);
                                applySnapshotObject(parsed, resJson.timestamp);
                            } else {
                                throw new Error("Fallback to GViz");
                            }
                        })
                        .catch(function() {
                            fetchSheetViaGviz(sheetUrl, "Data_Backups").then(function(res) {
                                const validRows = (res.rows || []).filter(function(r) {
                                    return r._rawCells && r._rawCells[6] && String(r._rawCells[6]).trim().indexOf('{') === 0;
                                });
                                if (validRows.length === 0) {
                                    throw new Error("ไม่พบ JSON Snapshot ในชีต Data_Backups");
                                }
                                const latestRow = validRows[validRows.length - 1];
                                const parsed = JSON.parse(String(latestRow._rawCells[6]));
                                setIsLoading(false);
                                applySnapshotObject(parsed, latestRow._rawCells[0]);
                            }).catch(function(err) {
                                setIsLoading(false);
                                alert("⚠️ ดึงข้อมูล Snapshot ไม่สำเร็จ:\nกรุณาตรวจสอบว่าได้อัปเดตโค้ดใน รหัส.gs (Deploy -> New version) หรือเปิดแชร์ไฟล์ Google Sheets เป็น 'ทุกคนที่มีลิงก์อ่านได้ (Viewer)' แล้วค่ะ\n\n(" + err.message + ")");
                            });
                        });
                } else if (pullMode === 'all_tabs') {
                    Promise.all([
                        fetchSheetViaGviz(sheetUrl, "Tab1_Production_Plan").catch(function() { return { rows: [] }; }),
                        fetchSheetViaGviz(sheetUrl, "Tab2_Purchasing_Analysis").catch(function() { return { rows: [] }; }),
                        fetchSheetViaGviz(sheetUrl, "Master_Products").catch(function() { return { rows: [] }; })
                    ]).then(function(results) {
                        const tab1Res = results[0], tab2Res = results[1], masterRes = results[2];
                        let loadedPlan = [], loadedPur = [], loadedMaster = [];

                        (tab1Res.rows || []).forEach(function(r, idx) {
                            const c = r._rawCells || [];
                            const name = String(c[4] || "").trim();
                            if (!name || name === "ชื่อสินค้า") return;
                            loadedPlan.push({
                                id: Date.now() + idx + Math.random(),
                                group: String(c[1] || ""),
                                productCode: String(c[3] || "-"),
                                name: name,
                                price: parseNum(c[5]),
                                lastYearSales: parseNum(c[6]),
                                target: parseNum(c[7]),
                                stock: parseNum(c[8])
                            });
                        });

                        (tab2Res.rows || []).forEach(function(r, idx) {
                            const c = r._rawCells || [];
                            const name = String(c[3] || "").trim();
                            if (!name || name === "ชื่อสินค้า") return;
                            const suppRaw = String(c[5] || "").trim();
                            loadedPur.push(calculateValues({
                                id: Date.now() + idx + Math.random(),
                                group: String(c[1] || ""),
                                productCode: String(c[2] || "-"),
                                name: name,
                                price: parseNum(c[4]),
                                printer: suppRaw === "-" ? "" : suppRaw,
                                cost: parseNum(c[6]),
                                discount: parseNum(c[7]) || avgDisc,
                                produceQty: parseNum(c[8])
                            }, avgDisc));
                        });

                        (masterRes.rows || []).forEach(function(r, idx) {
                            const c = r._rawCells || [];
                            const name = String(c[2] || "").trim();
                            if (!name || name === "ชื่อสินค้า") return;
                            loadedMaster.push({
                                id: Date.now() + idx + Math.random(),
                                productCode: String(c[1] || "-"),
                                name: name,
                                group: String(c[3] || ""),
                                price: parseNum(c[4]),
                                stock: parseNum(c[5]),
                                target: parseNum(c[6]),
                                sold: 0
                            });
                        });

                        if (loadedPlan.length === 0 && loadedPur.length === 0 && loadedMaster.length === 0) {
                            setIsLoading(false);
                            return alert("⚠️ ไม่สามารถอ่านตารางแยกชีตได้โดยตรง กรุณาใช้ปุ่ม '📥 ดึงจาก JSON Snapshot ล่าสุด' หรือตั้งค่าแชร์ไฟล์ Google Sheets เป็น 'ทุกคนที่มีลิงก์อ่านได้ (Viewer)' ค่ะ");
                        }

                        if (loadedPlan.length > 0) setPlanData(loadedPlan);
                        if (loadedPur.length > 0) setData(loadedPur);
                        if (loadedMaster.length > 0) {
                            setSettings(function(prev) {
                                return Object.assign({}, prev, { products: loadedMaster });
                            });
                        }

                        setIsLoading(false);
                        sendAuditLog("ดึงตารางข้อมูลจากชีต Tab1, Tab2 และ Master_Products", "SUCCESS", "Loaded Plan:" + loadedPlan.length + ", Pur:" + loadedPur.length + ", DB:" + loadedMaster.length);
                        alert("✅ ดึงข้อมูลจากชีต Google Sheets สำเร็จ!\n\n• ชีต Tab1_Production_Plan: " + loadedPlan.length + " รายการ\n• ชีต Tab2_Purchasing_Analysis: " + loadedPur.length + " รายการ\n• ชีต Master_Products (ฐานข้อมูลสินค้า): " + loadedMaster.length + " รายการ");
                    }).catch(function(err) {
                        setIsLoading(false);
                        alert("⚠️ เกิดข้อผิดพลาดในการดึงข้อมูล: " + err.message);
                    });
                }
            };

            // --- บันทึกสำรองข้อมูลขึ้น Google Sheets ---
            const pushBackupToCloud = function(isLogout, callback) {
                if (!gasUrl) {
                    if (callback) callback();
                    return alert("กรุณาระบุ Google Apps Script URL");
                }
                setLoadText("กำลังบันทึกข้อมูลสำรองขึ้น Google Sheets Cloud...");
                setIsLoading(true);

                const payload = {
                    action: "backup",
                    timestamp: new Date().toLocaleString('th-TH'),
                    version: VERSION,
                    docNo: docNo,
                    planCount: planData.length,
                    purCount: data.length,
                    prodCount: settings.products ? settings.products.length : 0,
                    suppCount: settings.suppliers ? settings.suppliers.length : 0,
                    planData: planData,
                    data: data,
                    settings: settings,
                    filesUploaded: filesUploaded,
                    snapshot: JSON.stringify({
                        data: data,
                        planData: planData,
                        settings: settings,
                        filesUploaded: filesUploaded,
                        docNo: docNo,
                        avgDisc: avgDisc
                    })
                };

                fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                }).then(function() {
                    setIsLoading(false);
                    sendAuditLog(isLogout ? "ออกจากระบบ (พร้อมบันทึกคลาวด์)..." : "สำรองข้อมูลขึ้นคลาวด์ (Cloud Backup)", "สำเร็จ", "Backed up " + planData.length + " plans & " + data.length + " purchases");
                    if (!isLogout) {
                        alert("✅ ส่งข้อมูลสำรองขึ้น Google Sheets (Data_Backups, Tab1, Tab2, Master_Products) เรียบร้อยแล้วค่ะ!");
                        testCloudPing(true);
                    }
                    if (callback) callback();
                }).catch(function(err) {
                    setIsLoading(false);
                    alert("⚠️ ไม่สามารถส่งข้อมูลขึ้นคลาวด์ได้: " + err.message);
                    if (callback) callback();
                });
            };

                    if (Array.isArray(sp) && sp.length) { setPlanData(sp.filter(Boolean)); hd = true; }
                    if (Array.isArray(sd) && sd.length) { 
                        const syncedData = sd.filter(Boolean).map(function(row) {

                            if (uRow.printer && loadedSuppliers.length > 0) {

                                           isSameProduct(uRow, { productCode: s.productCode, name: s.productName });
                                });
                                if (mSupp) {

                    if (ss && typeof ss === 'object') setSettings({ printers: Array.isArray(ss.printers) ? ss.printers : ['โรงพิมพ์ A', 'โรงพิมพ์ B'], products: Array.isArray(ss.products) ? ss.products.filter(Boolean) : [], suppliers: loadedSuppliers });
                    if (sf && typeof sf === 'object') setFilesUploaded(sf);

            const runSystemHealthCheck = function(showModal) {
                let fixedCount = 0;
                const cleanPlan = (planData || []).filter(Boolean).map(function(p) {
                    if (!p.id) { fixedCount++; return Object.assign({}, p, { id: Date.now() + Math.random() }); }
                    return p;
                });
                const allSupps = (settings.suppliers || []).filter(Boolean);
                const cleanData = (data || []).filter(Boolean).map(function(d) {
                    let uRow = Object.assign({}, d, { id: d.id || (Date.now() + Math.random()) });
                    if (uRow.printer) {
                        const mSupp = allSupps.find(function(s) {
                            return String(s.supplierName || '').trim().toLowerCase() === String(uRow.printer || '').trim().toLowerCase() &&
                                   isSameProduct(uRow, { productCode: s.productCode, name: s.productName });
                        });
                        if (mSupp) {
                            if (!uRow.suppRef && mSupp.suppRef) { uRow.suppRef = mSupp.suppRef; fixedCount++; }
                            if (!uRow.creditTerm && mSupp.creditTerm) { uRow.creditTerm = mSupp.creditTerm; fixedCount++; }
                        }
                    }
                    const recalc = calculateValues(uRow, avgDisc);
                    if (isNaN(recalc.bepQty) || isNaN(recalc.bepMoney)) fixedCount++;
                    return recalc;
                });
                setPlanData(cleanPlan);
                setData(cleanData);

                const checks = [
                    { name: "การเชื่อมต่อ Google Sheets & Apps Script Cloud", detail: cloudPing.status === 'online' ? ("ออนไลน์ (" + cloudPing.msg + ")") : "พร้อมเชื่อมต่อ (กดปุ่ม ทดสอบ Ping เพื่อตรวจสอบ)", ok: true },

                    { name: "การเชื่อมโยงเงื่อนไข Supplier (Ref. & เครดิต) กับหน้าเปรียบเทียบ", detail: "ซิงค์ข้อมูลจากฐานข้อมูล Supplier (" + allSupps.length + " รายการ) เข้าสู่หน้าเปรียบเทียบครบถ้วน", ok: true },
                    { name: "ระบบเอกสาร .Doc & PDF (Sarabun 14pt + โลโก้ฝังในไฟล์)", detail: "เลขที่ปัจจุบัน " + docNo + " | บังคับฟอนต์ Sarabun 14pt ทุกจุดและฝังโลโก้ Base64 เรียบร้อย", ok: true },
                    { name: "ระบบการโหลด V2.18 Core", detail: fixedCount > 0 ? ("ซิงค์และซ่อมแซมข้อมูลอัตโนมัติ " + fixedCount + " จุดเรียบร้อย") : "ทำงานปกติ ไม่พบข้อผิดพลาด", ok: true }
                ];
                setHealthReport({ status: 'OK', checks: checks });
                if (showModal) setModals(function(m) { return Object.assign({}, m, { health: true }); });
            };

            // --- EXCEL PARSING ENGINE ---
            const processExcelToPlan = function(rawData, fileType, fileName, sheetName) {
                let curP = planData.slice(), curS = (settings.products || []).slice(), agg = {};
                rawData.forEach(function(r) {
                    const keys = Object.keys(r);
                    const gV = function(matchArr, ex) {
                        const exArr = ex || [];
                        for (let i = 0; i < matchArr.length; i++) {
                            const k = matchArr[i];
                            const f = keys.find(function(x) { return x.trim().toLowerCase() === k.toLowerCase(); });
                            if (f && r[f] !== undefined && String(r[f]).trim() !== "") return r[f];
                        }
                        for (let i = 0; i < matchArr.length; i++) {
                            const k = matchArr[i];
                            const f = keys.find(function(x) {
                                const lk = x.toLowerCase();
                                return lk.includes(k.toLowerCase()) && !exArr.some(function(e) { return lk.includes(e.toLowerCase()); });
                            });
                            if (f && r[f] !== undefined && String(r[f]).trim() !== "") return r[f];
                        }
                        return null;
                    };
                    const tt = String(gV(['TARGET_TYPE','แหล่งเป้าหมาย','ประเภทเป้า','ประเภทเป้าหมาย']) || '').toUpperCase();
                    if (tt && !tt.match(/1|2|หลัก|ขยาย/)) return;
                    const nm = String(gV(['PRODUCT_NAME','ชื่อหนังสือ','รายการสินค้า','ชื่อสินค้า (ปก)','ชื่อสินค้า','name']) || '').trim();
                    if (!nm || nm.toLowerCase().includes('รวม')) return;

                    const cd = String(gV(['PRODUCT_CODE','รหัสสินค้า','รหัส','code']) || '').trim().toUpperCase();
                    const pr = parseNum(gV(['PRICE_PER_UNIT','ราคาปก/หน่วย','ราคาปก','ราคาขาย','ราคา','price']));
                    const k = cd + "_" + nm.toUpperCase() + "_" + pr;

                    const ex = ['บาท','เงิน','amount','baht','มูลค่า'];
                    const tgt = parseNum(gV(['ยอดจำนวนเล่มรวมที่ต้องจัดซื้อ','รวมเป้าหมาย 1+2','รวมเป้าหมาย','จำนวนเล่มรวม','TARGET_QTY','เป้าขาย','เป้าหมาย','เป้า','target'], ex));
                    const stk = parseNum(gV(['จำนวนคงเหลือ','คงเหลือทุกคลัง','คงเหลือ','สต๊อกสินค้า','สต๊อก','ยอดยกมา','stock','inventory'], ex));
                    const sld = parseNum(gV(['ยอดขายปีล่าสุด','จำนวนเล่มที่ขาย','ขายปีล่าสุด','ยอดขาย','ขาย','sold'], ex));

                    if (!agg[k]) agg[k] = { name: nm, productCode: cd, group: gV(['กลุ่มสินค้า','หมวดหมู่','group']) || "", price: pr, target: tgt, stock: stk, sold: sld };
                    else { agg[k].target += tgt; agg[k].stock += stk; agg[k].sold += sld; }
                });

                Object.values(agg).forEach(function(item) {
                    const dbIdx = curS.findIndex(function(p) { return isSameProduct(item, p); });
                    const pIdx = curP.findIndex(function(p) { return isSameProduct(item, p); });
                    let fPr = item.price > 0 ? item.price : (dbIdx >= 0 ? curS[dbIdx].price : 0);
                    let tgt = item.target, stk = item.stock, sld = item.sold;

                    let pItm = pIdx >= 0 ? Object.assign({}, curP[pIdx]) : { id: Date.now() + Math.random(), name: item.name, productCode: item.productCode };
                    if (fileType === 'target') { pItm.target = (parseNum(pItm.target) || 0) + tgt; if (sld > 0) pItm.lastYearSales = (parseNum(pItm.lastYearSales) || 0) + sld; }
                    else if (fileType === 'stock') { pItm.stock = (parseNum(pItm.stock) || 0) + stk; }
                    else { pItm.target = (parseNum(pItm.target) || 0) + tgt; pItm.stock = (parseNum(pItm.stock) || 0) + stk; pItm.lastYearSales = (parseNum(pItm.lastYearSales) || 0) + sld; }
                    
                    if (fPr > 0) pItm.price = fPr; 
                    if (item.group) pItm.group = item.group; 
                    if (item.productCode) pItm.productCode = item.productCode;
                    
                    if (pIdx >= 0) curP[pIdx] = pItm; else curP.push(pItm);

                    if (dbIdx >= 0) { 
                        if (tgt > 0) curS[dbIdx].target = tgt; 
                        if (stk > 0) curS[dbIdx].stock = stk; 
                        if (fPr > 0) curS[dbIdx].price = fPr; 
                    } else { 
                        curS.push({ id: Date.now() + Math.random(), group: item.group || "ทั่วไป", productCode: item.productCode, name: item.name, price: fPr, stock: stk, sold: sld, target: tgt }); 
                    }
                });
                setPlanData(curP); 
                setSettings(Object.assign({}, settings, { products: curS }));
                setFilesUploaded(Object.assign({}, filesUploaded, { [fileType]: fileName + " (" + sheetName + ")" }));
            };

            const handleUploadPlanFile = function(e, fileType) {

            // --- SUPPLIER BIDDING POP-UP LOGIC ---
            const openBidding = function(item) {
                setBidItem(item);
                let initBids = [];
                
                const dbMatches = (settings.suppliers || []).filter(Boolean).filter(function(s) {
                    return isSameProduct(item, { productCode: s.productCode, name: s.productName });
                });

                dbMatches.forEach(function(s) {
                    const sNameLower = String(s.supplierName || '').trim().toLowerCase();
                    const existIdx = initBids.findIndex(function(b) {
                        return String(b.supp || '').trim().toLowerCase() === sNameLower;
                    });
                    const bidObj = {
                        supp: s.supplierName || '',
                        cost: s.cost !== undefined ? s.cost : '',
                        suppRef: s.suppRef !== undefined ? String(s.suppRef) : '',
                        creditTerm: s.creditTerm !== undefined ? String(s.creditTerm) : ''
                    };
                    if (existIdx >= 0) {
                        initBids[existIdx] = bidObj;
                    } else {
                        initBids.push(bidObj);
                    }
                });

                if (item.printer || parseNum(item.cost) > 0) {
                    const rowPrinterLower = String(item.printer || '').trim().toLowerCase();
                    const foundIdx = initBids.findIndex(function(b) {
                        return String(b.supp || '').trim().toLowerCase() === rowPrinterLower;
                    });
                    if (foundIdx === -1) {
                        initBids.unshift({
                            supp: item.printer || '',
                            cost: item.cost || '',
                            suppRef: item.suppRef !== undefined ? String(item.suppRef) : '',
                            creditTerm: item.creditTerm !== undefined ? String(item.creditTerm) : ''
                        });
                    } else {
                        if (!initBids[foundIdx].suppRef && item.suppRef) initBids[foundIdx].suppRef = String(item.suppRef);
                        if (!initBids[foundIdx].creditTerm && item.creditTerm) initBids[foundIdx].creditTerm = String(item.creditTerm);
                    }
                }

                if (initBids.length === 0) {
                    initBids.push({ supp: '', cost: '', suppRef: '', creditTerm: '' });
                    initBids.push({ supp: '', cost: '', suppRef: '', creditTerm: '' });
                }

                setBids(initBids); 
                setModals(function(m) { return Object.assign({}, m, { bid: true }); });
            };

                doLoad("กำลังอัปเดตข้อมูลแบบกลุ่ม...", function() {
                    const ud = fData.map(function(r) {
                        let nr = Object.assign({}, r); 
                        if (bulkData.discount !== "") nr.discount = parseNum(bulkData.discount);
                        if (bulkData.printer) {
                            nr.printer = bulkData.printer; 
                            let s = (settings.suppliers || []).find(function(x) { return x.supplierName === nr.printer && isSameProduct(nr, { productCode: x.productCode, name: x.productName }); }); 
                            if (s) { 
                                nr.cost = parseNum(s.cost); 
                                if (s.suppRef !== undefined) nr.suppRef = String(s.suppRef);

            // --- DATABASE MANAGEMENT HANDLERS ---
            const editProductDB = function(p) {
                setNewProd({ id: p.id, group: p.group || "", productCode: p.productCode || "", name: p.name || "", author: p.author || "", price: p.price || "", stock: p.stock || 0, sold: p.sold || 0, target: p.target || 0 });
            };

            const editSupplierDB = function(s) {
                setNewSupp({ id: s.id, supplierName: s.supplierName || "", productCode: s.productCode || "", productName: s.productName || "", cost: s.cost || "", printQty: s.printQty || "", suppRef: s.suppRef || "", creditTerm: s.creditTerm || "" });
            };

            const handleSuppProductChange = function(val, field) {
                let updated = Object.assign({}, newSupp, { [field]: val });
                if (field === 'productName') {
                    const matchedProd = (settings.products || []).find(function(p) {
                        return String(p.name || '').trim().toLowerCase() === String(val).trim().toLowerCase();
                    });
                    if (matchedProd && matchedProd.productCode) {
                        updated.productCode = matchedProd.productCode;
                    }
                } else if (field === 'productCode') {
                    const matchedProd = (settings.products || []).find(function(p) {
                        return String(p.productCode || '').trim().toUpperCase() === String(val).trim().toUpperCase();
                    });
                    if (matchedProd && matchedProd.name) {
                        updated.productName = matchedProd.name;
                    }
                }
                setNewSupp(updated);
            };

            const handleSaveProduct = function() {
                if (!newProd.name) return alert("กรุณาระบุชื่อสินค้า");
                let np = (settings.products || []).slice();
                const exI = newProd.id ? np.findIndex(function(p) { return p.id === newProd.id; }) : np.findIndex(function(p) { return isSameProduct(newProd, p); });
                if (exI >= 0) { 
                    np[exI] = Object.assign({}, np[exI], newProd, { price: parseNum(newProd.price), stock: parseNum(newProd.stock), target: parseNum(newProd.target) }); 
                } else { 
                    np.push(Object.assign({}, newProd, { id: Date.now(), price: parseNum(newProd.price), stock: parseNum(newProd.stock), target: parseNum(newProd.target) })); 
                }
                setSettings(function(p) { return Object.assign({}, p, { products: np }); }); 
                setNewProd({ id:null, group:"", productCode:"", name:"", author:"", price:"", stock:0, sold:0, target:0 }); 
            };

            const handleSaveSupplier = function() {
                if (!newSupp.supplierName || !newSupp.productName) return alert("กรุณาระบุชื่อ Supplier และชื่อสินค้า");
                const cleanSupp = newSupp.supplierName.trim();
                const cleanProdName = newSupp.productName.trim();
                let cleanCode = (newSupp.productCode || "").trim().toUpperCase();

                if (!cleanCode) {
                    const matchedProd = (settings.products || []).find(function(p) {
                        return String(p.name || '').trim().toLowerCase() === cleanProdName.toLowerCase();
                    });
                    if (matchedProd && matchedProd.productCode) cleanCode = matchedProd.productCode;
                }

                const cleanCost = parseNum(newSupp.cost);
                const cleanRef = String(newSupp.suppRef || '').trim();
                const cleanCredit = String(newSupp.creditTerm || '').trim();

                let nPrinters = (settings.printers || []).slice();
                if (!nPrinters.includes(cleanSupp)) nPrinters.push(cleanSupp);

                let ns = (settings.suppliers || []).slice();
                const exI = newSupp.id 
                    ? ns.findIndex(function(x) { return x.id === newSupp.id; }) 
                    : ns.findIndex(function(x) { 
                        return String(x.supplierName || '').trim().toLowerCase() === cleanSupp.toLowerCase() && 
                               isSameProduct({ productCode: cleanCode, name: cleanProdName }, { productCode: x.productCode, name: x.productName }); 
                    });

                const savedRecord = Object.assign({}, newSupp, {
                    id: (exI >= 0 ? ns[exI].id : Date.now()),
                    supplierName: cleanSupp,
                    productCode: cleanCode,
                    productName: cleanProdName,
                    cost: cleanCost,
                    printQty: parseNum(newSupp.printQty),
                    suppRef: cleanRef,
                    creditTerm: cleanCredit
                });

                if (exI >= 0) {
                    ns[exI] = savedRecord;
                } else {
                    ns.push(savedRecord);
                }

                setSettings(function(s) { return Object.assign({}, s, { printers: nPrinters, suppliers: ns }); });

                setData(function(prevData) {
                    return prevData.map(function(row) {
                        if (isSameProduct(row, { productCode: cleanCode, name: cleanProdName }) &&
                            String(row.printer || '').trim().toLowerCase() === cleanSupp.toLowerCase()) {
                            return calculateValues(Object.assign({}, row, {
                                cost: cleanCost > 0 ? cleanCost : row.cost,
                                suppRef: cleanRef,
                                creditTerm: cleanCredit
                            }), avgDisc);
                        }
                        return row;
                    });
                });

                setNewSupp({ id:null, supplierName:"", productCode:"", productName:"", cost:"", printQty:"", suppRef:"", creditTerm:"" });
            };
            
            const handleExportDB = function() {
                doLoad("กำลังส่งออกฐานข้อมูล...", function() {
                    const exD = (settings.products || []).map(function(p, i) { return {"ลำดับ": i+1, "กลุ่ม": p.group, "รหัสสินค้า": p.productCode, "รายการสินค้า": p.name, "ราคาปก": p.price}; });
                    const ws = XLSX.utils.json_to_sheet(exD), wb = XLSX.utils.book_new(); 
                    XLSX.utils.book_append_sheet(wb, ws, "Products_DB"); 
                    XLSX.writeFile(wb, "Products_DB_" + Date.now() + ".xlsx");
                });
            };

            const handleFileUploadDB = function(e) {
                const f = e.target.files[0]; if (!f) return;
                doLoad("กำลังซิงค์ฐานข้อมูล...", function() {
                    const r = new FileReader();
                    r.onload = function(ev) {
                        try {
                            const wb = XLSX.read(ev.target.result, {type:'binary'});
                            if (wb.SheetNames.length > 1) {
                                const pref = wb.SheetNames.find(function(n) { return n.toUpperCase().match(/สรุปจัดซื้อ|สรุปรวมเป้าหมาย|T1\+T2|DATA_FOR_TU|สรุป/); });
                                setSheetSel({ wb: wb, type: 'db', fileName: f.name, name: pref || wb.SheetNames[0] }); 
                                setModals(function(m) { return Object.assign({}, m, { sheet: true }); });
                            } else processDBFile(wb, wb.SheetNames[0], f.name);
                        } catch (err) { alert("อ่านไฟล์ไม่สำเร็จ: " + err.message); }
                    }; r.readAsBinaryString(f);
                }); e.target.value = null;
            };

            const processDBFile = function(wb, sName, fName) {
                const raw = XLSX.utils.sheet_to_json(wb.Sheets[sName], {defval:""});
                let curS = (settings.products || []).slice(); let uc = 0, nc = 0;
                raw.forEach(function(r) {
                    const ks = Object.keys(r); 
                    const gV = function(arr, ex) {
                        const exArr = ex || [];
                        for (let i = 0; i < arr.length; i++) {
                            const k = arr[i];
                            let f = ks.find(function(x) { return x.toLowerCase() === k.toLowerCase(); });
                            if (f && r[f] !== undefined && String(r[f]).trim() !== "") return r[f];
                        }
                        for (let i = 0; i < arr.length; i++) {
                            const k = arr[i];
                            let f = ks.find(function(x) {
                                let l = x.toLowerCase();
                                return l.includes(k.toLowerCase()) && !exArr.some(function(e) { return l.includes(e); });
                            });
                            if (f && r[f] !== undefined && String(r[f]).trim() !== "") return r[f];
                        }
                        return null;
                    };
                    const nm = String(gV(['PRODUCT_NAME','ชื่อหนังสือ','รายการสินค้า','ชื่อสินค้า','name']) || '').trim(); 
                    if (!nm || nm.toLowerCase().includes('รวม')) return;
                    const cd = String(gV(['PRODUCT_CODE','รหัสสินค้า','รหัส','code']) || '').trim().toUpperCase();
                    const pr = parseNum(gV(['PRICE_PER_UNIT','ราคาปก','ราคาขาย','ราคา','price']));
                    
                    const idx = curS.findIndex(function(p) { return isSameProduct({productCode: cd, name: nm, price: pr}, p); });
                    if (idx >= 0) { if (pr > 0) curS[idx].price = pr; if (cd) curS[idx].productCode = cd; uc++; } 
                    else { curS.push({ id: Date.now() + Math.random(), group: gV(['กลุ่มสินค้า','กลุ่ม']) || '', productCode: cd, name: nm, price: pr, stock: 0, target: 0, sold: 0 }); nc++; }
                });
                setSettings(Object.assign({}, settings, { products: curS })); 
                alert("ซิงค์ฐานข้อมูลสำเร็จ (อัปเดต " + uc + " รายการ | เพิ่มใหม่ " + nc + " รายการ)");
            };

            const handleExportExcel = function(mode) {
                const isPlan = mode === 'plan';
                const a = isPlan ? planData.filter(function(p) { return getRecQty(p, safePct) > 0; }) : data.filter(function(d) { return parseNum(d.produceQty) > 0; });
                if (!a.length) return alert("ไม่มีข้อมูลที่มียอดสั่งผลิตสำหรับส่งออก");
                doLoad("กำลังสร้างไฟล์ Excel...", function() {
                    a.sort(function(x, y) { return String(x.name || '').localeCompare(String(y.name || ''), 'th'); });
                    const d = a.map(function(x, i) {
                        if (isPlan) return {"เลขที่เอกสาร":docNo, "ลำดับ":i+1, "กลุ่ม":x.group, "รหัสสินค้า":x.productCode, "รายการสินค้า":x.name, "ราคาปก":parseNum(x.price), "ขายปีล่าสุด":parseNum(x.lastYearSales), "เป้าขาย":parseNum(x.target), "สต๊อก":parseNum(x.stock), "ฐานผลิต":Math.max(0,parseNum(x.target)-parseNum(x.stock)), "ยอดผลิตแนะนำ":getRecQty(x,safePct)};
                        const pr = parseNum(x.price), cst = parseNum(x.cost), qty = parseNum(x.produceQty);
                        const disc = (x.discount !== undefined && x.discount !== "") ? parseNum(x.discount) : parseNum(avgDisc);
                        const netP = pr * (1 - (disc / 100));
                        const totCost = qty * cst;
                        const bepQ = (netP > 0 && totCost > 0) ? Math.ceil(totCost / netP) : 0;
                        return {"เลขที่เอกสาร":docNo, "ลำดับ":i+1, "รหัสสินค้า":x.productCode, "รายการสินค้า":x.name, "ราคาปก":pr, "%ส่วนลดการค้า":disc+"%", "ราคาสุทธิ/เล่ม":Number(netP.toFixed(2)), "จำนวนผลิต":qty, "ต้นทุน/เล่ม":cst, "มูลค่าต้นทุนรวม":totCost, "% ต่อปก":calcCostPct(cst,pr)+"%", "จุดคุ้มทุน BEP (เล่ม)":bepQ, "%BEP ต่อยอดผลิต":(qty>0?((bepQ/qty)*100).toFixed(1):0)+"%", "กำไรคาดการณ์":Number(((qty*netP)-totCost).toFixed(2)), "Supplier":x.printer||'-', "Ref.เงื่อนไข":x.suppRef||'-', "เครดิตชำระเงิน":x.creditTerm||'-'};
                    });
                    const ws = XLSX.utils.json_to_sheet(d), wb = XLSX.utils.book_new(); 
                    XLSX.utils.book_append_sheet(wb, ws, "Report"); 
                    XLSX.writeFile(wb, docNo.replace(':', '_') + "_Report.xlsx");
                });
            };

            // --- COMPUTED TOTALS & SORTING ---
            const pTots = useMemo(function() { 
                let i = planData.length, t = 0, s = 0, r = 0; 
                planData.forEach(function(p) { if (!p) return; t += parseNum(p.target); s += parseNum(p.stock); r += getRecQty(p, safePct); }); 
                return { i: i, t: t, s: s, r: r }; 
            }, [planData, safePct]);

            const dTots = useMemo(function() { 
                let q = 0, c = 0, tc = 0, bepSum = 0, netRevSum = 0, profitSum = 0; 
                data.forEach(function(p) { 
                    if (!p) return;
                    const qty = parseNum(p.produceQty), cst = parseNum(p.cost), pr = parseNum(p.price);
                    const disc = (p.discount !== undefined && p.discount !== "") ? parseNum(p.discount) : parseNum(avgDisc);
                    const netP = pr * (1 - (disc / 100));
                    const totCost = qty * cst;
                    const bepQ = (netP > 0 && totCost > 0) ? Math.ceil(totCost / netP) : 0;
                    const rev = qty * netP;
                    q += qty; 
                    c += totCost; 
                    tc += (qty * pr); 
                    bepSum += bepQ;
                    netRevSum += rev;
                    profitSum += (rev - totCost);
                }); 
                return { q: q, c: c, tc: tc, bepSum: bepSum, netRevSum: netRevSum, profitSum: profitSum }; 
            }, [data, avgDisc]);

            const groupedSuppliers = useMemo(function() {
                const groups = {};
                (settings.printers || []).forEach(function(pr) {
                    groups[pr] = [];
                });
                (settings.suppliers || []).filter(Boolean).forEach(function(s) {
                    const sName = s.supplierName || 'ไม่ระบุชื่อ';
                    if (!groups[sName]) groups[sName] = [];
                    groups[sName].push(s);
                });
                return groups;
            }, [settings.printers, settings.suppliers]);

            const sortFn = function(a, b, sc) {
                if (!a || !b) return 0;
                const getVal = function(row, key) {
                    if (key === 'recQty') return getRecQty(row, safePct);
                    if (key === 'baseQty') return Math.max(0, parseNum(row.target) - parseNum(row.stock));
                    const pr = parseNum(row.price), cst = parseNum(row.cost), qty = parseNum(row.produceQty);
                    const disc = (row.discount !== undefined && row.discount !== "") ? parseNum(row.discount) : parseNum(avgDisc);
                    const netP = pr * (1 - (disc / 100));
                    const totCost = qty * cst;
                    const bepQ = (netP > 0 && totCost > 0) ? Math.ceil(totCost / netP) : 0;

                    if (key === 'totCost') return totCost;
                    if (key === 'costPct') return pr > 0 ? (cst / pr) * 100 : 0;
                    if (key === 'netPrice') return netP;
                    if (key === 'bepQty') return bepQ;
                    if (key === 'bepPct') return qty > 0 ? (bepQ / qty) * 100 : 0;
                    if (key === 'expectedRev') return qty * netP;
                    if (key === 'expectedProfit') return (qty * netP) - totCost;
                    return row[key];
                };
                let x = getVal(a, sc.key), y = getVal(b, sc.key);
                const numericKeys = ['price', 'lastYearSales', 'target', 'stock', 'baseQty', 'recQty', 'produceQty', 'cost', 'bepMoney', 'totCost', 'costPct', 'discount', 'netPrice', 'bepQty', 'bepPct', 'expectedRev', 'expectedProfit'];
                if (numericKeys.includes(sc.key)) {
                    const nX = parseNum(x), nY = parseNum(y);
                    return sc.direction === 'asc' ? nX - nY : nY - nX;
                }
                const sX = String(x || '').toLowerCase(), sY = String(y || '').toLowerCase();
                return sc.direction === 'asc' ? sX.localeCompare(sY, 'th') : sY.localeCompare(sX, 'th');
            };

            const fPlanData = useMemo(function() {
                let d = planData.slice().filter(Boolean); 
                if (planSortConfig.key) d.sort(function(a,b) { return sortFn(a, b, planSortConfig); });
                return d.filter(function(i) {
                    return (!filters.g || String(i.group || '').includes(filters.g)) && 
                           (!filters.n || String(i.name || '').toLowerCase().includes(filters.n.toLowerCase())) && 
                           (!filters.t || Object.values(i).some(function(v) { return String(v).toLowerCase().includes(filters.t.toLowerCase()); }));
                });
            }, [planData, planSortConfig, filters, safePct]);

            const fData = useMemo(function() {
                let d = data.slice().filter(Boolean); 
                if (sortConfig.key) d.sort(function(a,b) { return sortFn(a, b, sortConfig); });
                return d.filter(function(i) {
                    return (!filters.g || String(i.group || '').includes(filters.g)) && 
                           (!filters.n || String(i.name || '').toLowerCase().includes(filters.n.toLowerCase())) && 
                           (!filters.t || Object.values(i).some(function(v) { return String(v).toLowerCase().includes(filters.t.toLowerCase()); }));
                });
            }, [data, sortConfig, filters, avgDisc]);

            const uGrp = useMemo(function() {
                return Array.from(new Set((tab === 'plan' ? planData : data).filter(Boolean).map(function(p) { return p.group; }).filter(Boolean))).sort();
            }, [planData, data, tab]);

            const allProductNamesList = useMemo(function() {
                return Array.from(new Set((settings.products || []).filter(Boolean).map(function(p) { return p.name; }).concat((planData || []).filter(Boolean).map(function(p) { return p.name; })).concat((data || []).filter(Boolean).map(function(p) { return p.name; })).filter(Boolean)));
            }, [planData, data, settings.products]);

            const uNm = useMemo(function() {
                if (filters.n) {
                    const kw = filters.n.toLowerCase();
                    return allProductNamesList.filter(function(n) { return String(n).toLowerCase().includes(kw); }).slice(0, 150);
                }
                return allProductNamesList.slice(0, 150);
            }, [allProductNamesList, filters.n]);

            const suppDbSuggestedNames = useMemo(function() {
                if (newSupp.productName) {
                    const kw = newSupp.productName.toLowerCase();
                    return allProductNamesList.filter(function(n) { return String(n).toLowerCase().includes(kw); }).slice(0, 150);
                }
                return allProductNamesList.slice(0, 150);
            }, [allProductNamesList, newSupp.productName]);

            // --- LOGIN VIEW ---
            if (view === 'login') return (
                <div className="flex justify-center items-center h-screen bg-slate-100">
                    <form className="bg-white p-10 rounded-3xl shadow-xl flex flex-col items-center border-t-[6px] border-[#002060] w-[460px]" onSubmit={handleLogin}>
                        <img src={logoDataUri} className="app-logo mb-4" style={{ height: '110px' }} />
                        <h1 className="text-2xl mb-1 text-center text-[#002060] font-bold">Purchase Planning</h1>
                        <p className="text-center text-violet-700 font-bold bg-purple-50 px-4 py-1.5 rounded-lg border border-purple-100 mb-3 w-full text-xs">{VERSION}</p>
                        <div className="w-full mb-5 flex items-center justify-between bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200 text-[11px]">
                            <span className="font-bold text-emerald-800">
                                {cloudPing.status === 'online' ? ('🟢 Google Sheets เชื่อมต่อแล้ว (' + cloudPing.latency + 'ms)') : cloudPing.status === 'checking' ? '⏳ กำลังตรวจสอบคลาวด์...' : '⚪ พร้อมเชื่อมต่อ Google Sheets'}
                            </span>
                            <button type="button" onClick={function() { testCloudPing(false); }} className="text-blue-700 font-bold hover:underline">ทดสอบ Ping</button>
                        </div>
                        <div className="w-full flex flex-col gap-4">
                            <div className="relative">
                                <input type={showPwd ? "text" : "password"} value={pwd} onChange={function(e) { setPwd(e.target.value); }} className="w-full border-2 border-gray-200 p-3.5 rounded-xl text-lg text-center tracking-widest outline-none focus:border-[#002060]" placeholder="รหัสผ่าน (pass1111)" />
                                <button type="button" onClick={function() { setShowPwd(!showPwd); }} className="absolute right-4 top-3.5 text-lg text-gray-400">{showPwd ? "🙈" : "👁️"}</button>
                            </div>
                            {err && <div className="text-red-600 font-bold text-center bg-red-50 p-2.5 rounded-lg border border-red-200 text-xs">{err}</div>}
                            <button type="submit" className="w-full btn btn-blue py-3.5 text-sm">เข้าสู่ระบบ</button>
                        </div>
                    </form>
                    {modals.restore && (
                        <div className="modal-overlay">
                            <div className="bg-white p-8 rounded-2xl shadow-2xl border-t-[6px] border-[#002060] w-[480px] text-center">
                                <h3 className="text-xl mb-3 text-[#002060] font-bold">📂 พบข้อมูลการทำงานล่าสุด</h3>
                                <p className="mb-6 text-gray-600 text-sm">ต้องการเปิดข้อมูลเดิมในเครื่อง หรือดึงข้อมูลล่าสุดจาก Google Sheets Cloud?</p>
                                <div className="flex flex-col gap-2.5">
                                    <button onClick={handleRestoreYes} className="w-full btn btn-blue py-2.5 text-xs">1. ทำต่อจากข้อมูลล่าสุดในเครื่อง ({planData.length} รายการ)</button>
                                    <button onClick={function() { setModals(function(m) { return Object.assign({}, m, { restore: false }); }); setView('main'); pullFromGoogleSheets('snapshot'); }} className="w-full btn btn-green py-2.5 text-xs">2. ☁️ ดึงข้อมูลล่าสุดจาก Google Sheets (Data_Backups)</button>
                                    <button onClick={handleRestoreNo} className="w-full btn bg-gray-200 text-gray-700 py-2 text-xs">3. เริ่มงานใหม่ (ล้างตาราง)</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            // --- MAIN WORKSPACE VIEW ---
            return (
                <div className={"main-container " + (isMax ? "maximized" : "")}>
                    {/* Collapsible Top Header */}
                    {(!isMax && showHead) && (
                        <div className="flex flex-wrap justify-between items-center mb-2 bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-200 shrink-0 gap-2">
                            <div className="flex items-center gap-3">
                                <img src={logoDataUri} className="app-logo border-r pr-3" />
                                <div>
                                    <h2 className="text-base m-0 text-[#002060] font-bold uppercase tracking-wider">Purchase Planning & BEP System</h2>
                                    <div className="flex items-center gap-2 mt-0.5 flex-wrap">

                    {/* --- POP-UP: A4 PREVIEW WITH TOP/SIDE MARGIN CONTROLS & ZOOM --- */}
                    {modals.preview && (
                        <div className="modal-overlay overflow-y-auto" style={{alignItems:'flex-start'}}>
                            <div className="fixed top-3 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-2xl shadow-2xl flex flex-wrap items-center gap-2.5 z-[60] print-hidden border border-slate-700 max-w-[95vw]">
                                <span className="text-xs font-bold text-emerald-400">เลขที่: {docNo}</span>
                                <button onClick={handleNextDocNo} className="px-2 py-0.5 rounded bg-slate-700 hover:bg-emerald-600 text-[11px] font-bold">+ รันเลข</button>
                                <span className="text-slate-600">|</span>
                                <select value={previewMode || tab} onChange={function(e) { setPreviewMode(e.target.value); }} className="bg-slate-800 text-white text-xs font-bold px-2 py-0.5 rounded border border-slate-600">
                                    <option value="plan">1. รายงานแผนผลิต (Tab 1)</option>
                                    <option value="pur">2. ขออนุมัติจัดซื้อ + Supplier (Tab 2)</option>
                                    <option value="bep">3. รายงานจุดคุ้มทุน BEP (Tab 3)</option>
                                </select>
                                <span className="text-slate-600">|</span>
                                <span className="text-[11px] text-slate-300 font-bold">ขอบบน-ล่าง:</span>
                                <button onClick={function() { setDocPadY(function(p) { return Math.max(5, p - 2); }); }} className="w-5 h-5 rounded bg-slate-700 hover:bg-sky-600 font-bold text-xs flex items-center justify-center">-</button>
                                <span className="text-[11px] font-bold w-8 text-center">{docPadY}มม.</span>
                                <button onClick={function() { setDocPadY(function(p) { return Math.min(35, p + 2); }); }} className="w-5 h-5 rounded bg-slate-700 hover:bg-sky-600 font-bold text-xs flex items-center justify-center">+</button>
                                
                                <span className="text-[11px] text-slate-300 font-bold ml-1">ขอบซ้าย-ขวา:</span>
                                <button onClick={function() { setDocPadX(function(p) { return Math.max(5, p - 2); }); }} className="w-5 h-5 rounded bg-slate-700 hover:bg-sky-600 font-bold text-xs flex items-center justify-center">-</button>
                                <span className="text-[11px] font-bold w-8 text-center">{docPadX}มม.</span>
                                <button onClick={function() { setDocPadX(function(p) { return Math.min(35, p + 2); }); }} className="w-5 h-5 rounded bg-slate-700 hover:bg-sky-600 font-bold text-xs flex items-center justify-center">+</button>

                                <span className="text-slate-600">|</span>
                                <span className="text-[11px] font-bold text-slate-300">ซูม:</span>
                                <button onClick={function() { setPreviewZoom(function(z) { return Math.max(50, z - 10); }); }} className="w-5 h-5 rounded-full bg-slate-700 hover:bg-sky-600 font-bold text-xs flex items-center justify-center">-</button>
                                <span className="font-bold text-xs w-9 text-center">{previewZoom}%</span>
                                <button onClick={function() { setPreviewZoom(function(z) { return Math.min(150, z + 10); }); }} className="w-5 h-5 rounded-full bg-slate-700 hover:bg-sky-600 font-bold text-xs flex items-center justify-center">+</button>
                                <button onClick={function() { setPreviewZoom(85); setDocPadY(15); setDocPadX(15); }} className="text-[10px] text-sky-400 hover:underline">รีเซ็ต</button>
                            </div>

                            <button onClick={function() { setPreviewMode(null); setModals(function(m) { return Object.assign({}, m, { preview: false }); }); }} className="fixed right-5 top-3 bg-red-600 text-white w-9 h-9 rounded-full font-bold text-base shadow-2xl flex items-center justify-center print-hidden z-[60] hover:bg-red-700">✖</button>
                            
                            <div className="w-full flex justify-center print:block print:p-0">
                                <div className="a4-preview-container transition-all duration-150" style={{ transform: "scale(" + (previewZoom / 100) + ")", transformOrigin: 'top center', marginBottom: '60px', padding: docPadY + "mm " + docPadX + "mm" }}>
                                    {(function() {
                                        const activeMode = previewMode || tab;
                                        const activeArr = activeMode === 'plan' ? planData : data;
                                        return <div dangerouslySetInnerHTML={{__html: getDocxHTML(activeArr, activeMode, safePct, aiRef, docNo, avgDisc, logoDataUri)}}></div>;
                                    })()}
                                    
                                    <div className="mt-10 pt-4 border-t border-gray-300 flex justify-end gap-2.5 print-hidden flex-wrap bg-slate-50 p-3 rounded-xl">
                                        <button onClick={function() {
                                            const activeMode = previewMode || tab;
                                            const isPlan = activeMode === 'plan';
                                            let validItems = (isPlan ? planData : data).filter(function(r) { return r && (isPlan ? getRecQty(r, safePct) > 0 : parseNum(r.produceQty) > 0); });
                                            let sumR = 0, sumC = 0;
                                            validItems.forEach(function(r) { sumR += (isPlan ? getRecQty(r, safePct) : parseNum(r.produceQty)); sumC += (parseNum(r.produceQty) * parseNum(r.cost)); });
                                            let txt = "📋 บันทึกภายใน (" + docNo + ")\nเรื่อง: สรุป" + (isPlan ? "แผนความต้องการผลิต" : activeMode === 'bep' ? "วิเคราะห์จุดคุ้มทุน (BEP)" : "ขออนุมัติการผลิต") + "\n📅 วันที่: " + CURRENT_DATE + "\n📦 จำนวน: " + validItems.length + " รายการ (" + formatNum(sumR) + " เล่ม)\n";
                                            if (!isPlan) txt += "💰 ยอดเงินลงทุนรวม: " + formatNum(sumC) + " บาท | จุดคุ้มทุนรวม: " + formatNum(dTots.bepSum) + " เล่ม\n";
                                            validItems.slice(0,10).forEach(function(r, i) { let q = isPlan ? getRecQty(r, safePct) : parseNum(r.produceQty); txt += (i+1) + ". " + (r.productCode || '-') + " " + r.name + " = " + formatNum(q) + " เล่ม " + (r.printer ? ("(" + r.printer + ")") : "") + "\n"; });
                                            navigator.clipboard.writeText(txt).then(function() { alert("✅ คัดลอกข้อความสำหรับส่ง Line เรียบร้อยแล้ว"); });
                                        }} className="btn bg-emerald-600 text-white hover:bg-emerald-700">💬 คัดลอกส่ง Line</button>
                                        
                                        <button onClick={function() {
                                            const activeMode = previewMode || tab;
                                            const isPlan = activeMode === 'plan';
                                            const subject = encodeURIComponent("[" + docNo + "] บันทึกภายใน สรุป" + (isPlan ? "แผนผลิต" : activeMode === 'bep' ? "จุดคุ้มทุน BEP" : "ขออนุมัติผลิต") + " - " + CURRENT_DATE);
                                            const body = encodeURIComponent("เรียน กรรมการผู้จัดการ (ผ่าน ผู้จัดการทั่วไป)\n\nขอส่งบันทึกภายใน เลขที่ " + docNo + " ประจำวันที่ " + CURRENT_DATE + " ตามรายละเอียดที่แนบมาพร้อมนี้");
                                            window.location.href = "mailto:?subject=" + subject + "&body=" + body;
                                        }} className="btn bg-sky-600 text-white hover:bg-sky-700">📧 ส่งอีเมล</button>
                                        
                                        <button onClick={function() { window.print(); }} className="btn bg-red-600 text-white hover:bg-red-700">🖨️ พิมพ์ / บันทึก PDF</button>
                                        
                                        <button onClick={function() {
                                            const activeMode = previewMode || tab;
                                            const activeArr = activeMode === 'plan' ? planData : data;
                                            const u = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(getDocxHTML(activeArr, activeMode, safePct, aiRef, docNo, avgDisc, logoDataUri)); 
                                            const a = document.createElement('a'); a.href = u; a.download = docNo.replace(':', '_') + "_Internal_Memo.doc"; 
                                            document.body.appendChild(a); a.click(); document.body.removeChild(a);
                                        }} className="btn btn-blue">📥 โหลดเป็น Word (.Doc)</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Loading Spinner */}
                    {isLoading && (
                        <div className="modal-overlay z-[100]">
                            <div className="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center">
                                <div className="w-12 h-12 border-4 border-blue-100 border-t-[#002060] rounded-full animate-spin mb-3"></div>
                                <b className="text-[#002060] text-sm">{loadText}</b>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>

    <!-- ตัวกระตุ้นสำรอง: หากเบราว์เซอร์อ่านจบไฟล์แล้ว Babel ยังไม่เริ่มทำงาน จะสั่ง Babel.transformScriptTags() ทันที -->
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var rootEl = document.getElementById('root');
                if (rootEl && rootEl.innerHTML.trim() === '' && window.Babel && typeof window.Babel.transformScriptTags === 'function') {
                    try { window.Babel.transformScriptTags(); } catch(e) { console.error(e); }
                }
            }, 100);
        });
    </script>
</body>
</html>
